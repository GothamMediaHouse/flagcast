<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin clubs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#123628}a:hover{color:#1c4a37}
</style>
</helmet>
<div style="width: 1280px; height: 820px; display: flex; background: #f2f4ef; font-family: Inter, system-ui, sans-serif; color: #14201a; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,0.12)">
<nav aria-label="Admin" style="width: 248px; flex: none; box-sizing: border-box; background: #123628; color: #eef3ec; display: flex; flex-direction: column; padding: 14px 12px 12px; gap: 14px">
<div style="display: flex; gap: 8px; padding: 2px 6px" aria-hidden="true">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840"></span>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 4px 6px 2px">
<img src="../../../public/golf/brand/mark.svg" alt="" style="width: 34px; height: 34px; border-radius: 8px; box-shadow: 0 0 0 1px rgba(238,243,236,0.18)">
<div style="display: flex; flex-direction: column; line-height: 1">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.5px">FLAGCAST</span>
<span style="font-size: 10px; font-weight: 700; letter-spacing: 1.4px; color: #ffffff; background: #c8312b; border-radius: 3px; padding: 2px 5px; margin-top: 4px; align-self: flex-start">ADMIN</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{nav}}" as="s" hint-placeholder-count="4">
<a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; font-size: 14px; text-decoration: none; background: {{s.bg}}; color: {{s.fg}}; font-weight: {{s.weight}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{s.icon}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"></path></svg>
<span style="flex: 1">{{s.label}}</span>
<span style="font-size: 12px; font-weight: 700; color: {{s.countColor}}">{{s.count}}</span>
</a>
</sc-for>
</div>
<div style="flex: 1"></div>
<div style="font-size: 12px; color: #a9bdb0; padding: 0 8px; display: flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #5cc48a"></span>flagcast.app · connected</div>
</nav>
<main style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 20px; background: #fbfcf9; border-bottom: 1px solid #d3dacf">
<h1 style="margin: 0; font-size: 15px; font-weight: 700">Clubs</h1>
<span style="font-size: 13px; color: #56625a">6 clubs · 1 waiting</span>
<div style="flex: 1"></div>
<label style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid #d3dacf; background: #ffffff; width: 220px; box-sizing: border-box">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#56625a" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input type="search" placeholder="Find a club" aria-label="Find a club" style="all: unset; flex: 1; font-size: 13px">
</label>
<button style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 7px; border: 1px solid #d3dacf; background: #ffffff; font: 600 13px Inter, sans-serif; color: #14201a; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 5h18v11H3zM8 20h8M12 16v4"></path></svg>Take over screens</button>
</header>
<div style="flex: 1; min-height: 0; padding: 18px 20px; display: flex; flex-direction: column; gap: 16px">
<section aria-label="Waiting for approval" style="display: flex; align-items: center; gap: 16px; background: #fff8e1; border: 1px solid #ecd58a; border-radius: 12px; padding: 12px 16px">
<span style="width: 36px; height: 36px; border-radius: 50%; background: #e8c547; color: #1a1a10; display: flex; align-items: center; justify-content: center; font-weight: 700">!</span>
<div style="flex: 1; display: flex; flex-direction: column; line-height: 1.35">
<span style="font-weight: 700; font-size: 14px">[New club] asked to join</span>
<span style="font-size: 13px; color: #56625a">Signed up 2 hours ago · wants 1 tournament · pro shop contact on file</span>
</div>
<button style="height: 32px; padding: 0 14px; border-radius: 7px; border: 1px solid #d3dacf; background: #ffffff; font: 600 13px Inter, sans-serif; color: #14201a; cursor: pointer">Decline</button>
<button style="height: 32px; padding: 0 16px; border-radius: 7px; border: 0; background: #123628; color: #eef3ec; font: 600 13px Inter, sans-serif; cursor: pointer">Approve</button>
</section>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{clubs}}" as="c" hint-placeholder-count="6">
<article style="position: relative; height: 262px; border-radius: 14px; overflow: hidden; background: #123628; color: #ffffff">
<img src="{{c.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div style="position: absolute; inset: 0; background: linear-gradient(0deg, rgba(8,24,17,0.92) 0%, rgba(8,24,17,0.35) 55%, rgba(8,24,17,0.1) 100%)"></div>
<span style="position: absolute; top: 12px; left: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; padding: 3px 7px; border-radius: 4px; background: {{c.chipBg}}; color: {{c.chipFg}}">{{c.status}}</span>
<div style="position: absolute; left: 16px; right: 16px; bottom: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; line-height: 1.15"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px">{{c.name}}</span><span style="font-size: 12px; color: #dfe8e1">{{c.where}}</span></div>
<div style="display: flex; gap: 16px; font-size: 12px; color: #cfdbd2">
<span><strong style="color: #ffffff; font-size: 15px">{{c.left}}</strong> left</span>
<span><strong style="color: #ffffff; font-size: 15px">{{c.events}}</strong> tournaments</span>
<span><strong style="color: #ffffff; font-size: 15px">{{c.people}}</strong> staff</span>
</div>
<div style="display: flex; gap: 6px">
<button style="flex: 1; height: 28px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.16); font: 600 12px Inter, sans-serif; color: #ffffff; cursor: pointer">+1</button>
<button style="flex: 1; height: 28px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.16); font: 600 12px Inter, sans-serif; color: #ffffff; cursor: pointer">+5</button>
<button style="flex: 2; height: 28px; border-radius: 6px; border: 0; background: #ffffff; font: 600 12px Inter, sans-serif; color: #123628; cursor: pointer">Open club</button>
</div>
</div>
</article>
</sc-for>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const nav = [
      ['Clubs', '7', 'M3 21h18M5 21V9l7-5l7 5v12M10 21v-6h4v6', true, '#e8c547'],
      ['Tournaments', '14', 'M5 21V4M5 4h11l-2 4l2 4H5', false, '#a9bdb0'],
      ['Screens & phones', '9', 'M3 5h18v11H3zM8 20h8M12 16v4', false, '#a9bdb0'],
      ['Activity', '', 'M3 12h4l3-8l4 16l3-8h4', false, '#a9bdb0']
    ].map(([label, count, d, on, countColor]) => ({ label, count, d, countColor: on ? '#123628' : countColor,
      bg: on ? '#eef3ec' : 'transparent', fg: on ? '#123628' : '#dfe8e1', icon: on ? '#123628' : '#a9bdb0', weight: on ? '600' : '500' }));
    const live = { chipBg: '#e8c547', chipFg: '#1a1a10' }, on = { chipBg: '#eef3ec', chipFg: '#123628' }, off = { chipBg: '#56625a', chipFg: '#ffffff' };
    const clubs = [
      ['[Club one]', 'West Palm Beach, FL', 'img/course-sunset.jpg', 'LIVE NOW', live, '3', '2', '4'],
      ['[Club two]', '[Town, State]', 'img/course-flag.jpg', 'APPROVED', on, '∞', '6', '3'],
      ['[Club three]', '[Town, State]', 'img/course-green.jpg', 'APPROVED', on, '1', '3', '2'],
      ['[Club four]', '[Town, State]', 'img/course-aerial.jpg', 'APPROVED', on, '0', '2', '1'],
      ['[Club five]', '[Town, State]', 'img/course-wide.jpg', 'SWITCHED OFF', off, '0', '1', '1'],
      ['[Club six]', '[Town, State]', 'img/course-sunset.jpg', 'APPROVED', on, '5', '0', '2']
    ].map(([name, where, img, status, chip, left, events, people]) => ({ name, where, img, status, ...chip, left, events, people }));
    return { nav, clubs };
  }
}
</script>
</body>
</html>
