<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Course notice · Flagcast</title>
<link rel="icon" href="/golf/brand/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/golf/brand/app-icon-180.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/golf/golf.css">
<style>
/* The on-course notice (the Terms ask clubs to post it): cameras are on, and what the course map shares. One letter
   page for the first tee, the clubhouse door and each camera hole, with the club's logo (Flagcast's for a demo or a
   club with no logo) and the tournament's own camera holes. Always light, for paper. Big print: landscape, bigger. */
:root { color-scheme: light; --paper: #fff; --ink: #14201a; --muted: #56625a; --line: #c9d1c5; }
body { background: #e9ece6; color: var(--ink); }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; background: var(--green); color: var(--on-green); }
.bar p { margin: 0; color: var(--on-green-muted); font-size: .9rem; }
.sheet { display: flex; justify-content: center; padding: 16px; }
.page { width: min(100%, 8in); aspect-ratio: 8.5 / 11; background: #fff; box-sizing: border-box; padding: .55in .6in; font-size: 13pt;
  display: grid; grid-template-rows: auto auto 1fr auto; gap: .25in; box-shadow: 0 1px 6px rgba(0,0,0,.12); }
.head { display: flex; align-items: center; gap: .25in; border-bottom: .08in solid var(--club, var(--ink)); padding-bottom: .15in; }
.head img { height: 5em; width: auto; max-width: 15em; object-fit: contain; }
.ev { font-family: var(--f-mono); font-size: .8em; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h2.big { font-family: var(--f-display); font-weight: 800; font-size: 3.4em; line-height: .95; text-transform: uppercase; margin: 0; }
.items { display: grid; gap: .28in; align-content: start; }
.item h3 { font-family: var(--f-display); font-weight: 800; font-size: 1.7em; text-transform: uppercase; margin: 0 0 .05in; line-height: 1; }
.item p { margin: 0; line-height: 1.4; }
.foot { display: flex; align-items: center; gap: .2in; border-top: 1px solid var(--line); padding-top: .15in; }
.qr svg { width: 1.1in; height: 1.1in; display: block; }
.foot p { margin: 0; color: var(--muted); line-height: 1.35; font-size: .9em; }
.foot b { color: var(--ink); }
.big .page { width: min(100%, 10.5in); aspect-ratio: 11 / 8.5; font-size: 16pt; padding: .45in .6in; }
@page { size: letter portrait; margin: .25in; }
@page sign { size: letter landscape; margin: .25in; }
@media print {
  body { background: #fff; }
  .bar { display: none; }
  .sheet { padding: 0; }
  .page { width: 8in; height: 10.5in; aspect-ratio: auto; box-shadow: none; margin: 0 auto; }
  .big .page { page: sign; width: 10.5in; height: 8in; }
}
</style>
</head>
<body>
<div class="bar"><div><h1 style="font-size:1.4rem">Course notice</h1><p id="sub">Loading…</p></div><div style="display:flex;gap:8px;align-items:center">
  <label style="display:flex;gap:6px;align-items:center;color:var(--on-green)"><input type="checkbox" id="big" style="width:auto"> Big print (landscape)</label>
  <button class="btn primary" onclick="print()">Print</button></div></div>
<div class="sheet"><div class="page" id="page"></div></div>
<script src="/golf/qrcode.js"></script>
<script type="module">
import { eventId, esc, api } from '/golf/client.js';
import { camList } from '/golf/core.js';
const bigBox = document.getElementById('big');
const setBig = (on) => { document.body.classList.toggle('big', on); bigBox.checked = on; };
setBig(location.hash.includes('big'));
bigBox.addEventListener('change', () => setBig(bigBox.checked));
const page = document.getElementById('page');
try {
  // only what anyone can see: the tournament's name, branding and cameras
  const S = await fetch(api('state')).then((r) => { if (!r.ok) throw new Error('There is no tournament at this address.'); return r.json(); });
  const brand = S.brand || {};
  if (brand.accent) document.documentElement.style.setProperty('--club', brand.accent);
  const logo = brand.logo ? `<img src="${esc(brand.logo)}" alt="${esc(brand.club || 'Club logo')}">` : '<img src="/golf/brand/wide-on-light.svg" alt="Flagcast">';
  const title = S.screens?.title || S.name;
  // "Holes 7 and 16 and the clubhouse": the cameras golfers can see
  const cams = camList(S), holes = [...new Set(cams.filter((c) => c.n > 0).map((c) => c.n))].sort((a, b) => a - b), club = cams.some((c) => c.n === 0);
  const and = (a) => a.length < 2 ? a.join('') : `${a.slice(0, -1).join(', ')} and ${a.at(-1)}`;
  const where = [holes.length ? `${holes.length === 1 ? 'Hole' : 'Holes'} ${and(holes.map(String))}` : '', club ? 'the clubhouse' : ''].filter(Boolean);
  const camText = where.length ? `${and(where)} ${where.length > 1 || holes.length > 1 ? 'have' : 'has'} cameras` : 'Some holes may have cameras today';
  const junior = !!S.junior;
  const url = `${location.origin}/privacy/`;
  const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  document.getElementById('sub').textContent = `${title}. Post one at the first tee, the clubhouse door and each camera hole.`;
  page.innerHTML = `<div class="head">${logo}<div class="ev">${esc(title)}${S.date ? ` · ${esc(S.date)}` : ''}</div></div>
    <h2 class="big">Today’s tournament is live</h2>
    <div class="items">
      <div class="item"><h3>Cameras are on</h3><p>${esc(camText)}. You may appear live on the clubhouse TVs and in replays on players’ phones${junior ? '' : ', and players can save their shot'}.
        Want to stay off camera, or want a clip taken down? Tell the tournament desk, or email hello@flagcast.app.</p></div>
      <div class="item"><h3>Location, only if you turn it on</h3><p>If your group turns on GPS for yardages, the tournament desk${junior ? '' : ' and the other groups in today’s tournament'} can see where your group is on the course.${junior ? '' : ' Tap Hide on the map to hide from other players.'} Locations are wiped when the results are final.</p></div>
      <div class="item"><h3>Nothing is sold</h3><p>Your name and scores show on the leaderboard. Nothing is used for ads, and you can ask for your information to be deleted.</p></div>
    </div>
    <div class="foot"><div class="qr">${qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true })}</div>
      <p><b>The details: flagcast.app/privacy</b><br>Questions on the day: the tournament desk. Anything else: hello@flagcast.app</p></div>`;
} catch (e) {
  page.innerHTML = `<p>${esc(e.message)}</p>`;
}
</script>
</body>
</html>
