<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Flagcast Admin</title>
<link rel="icon" href="/golf/brand/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/golf/golf.css">
<style>
.topbar .in { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
.topbar h1 { font-size: 2rem; display: flex; align-items: center; gap: 12px; }
.topbar h1 img { height: 40px; }
.topbar .btn { background: transparent; color: var(--on-green); border-color: rgba(255,255,255,.25); padding: 6px 12px; }
main { max-width: 1100px; margin: 0 auto; padding: 22px 16px 60px; }
.grid { display: grid; grid-template-columns: 1fr 320px; gap: 22px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
h2 { font-size: 1.4rem; margin: 0 0 10px; }
label { display: grid; gap: 4px; font-size: .82rem; color: var(--muted); font-weight: 500; margin-bottom: 10px; }
input, select { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
.help { color: var(--muted); font-size: .86rem; margin: 0 0 10px; }
.err { color: var(--red); font-size: .88rem; }
.warn { background: color-mix(in srgb, var(--warn) 18%, var(--card)); border: 1px solid var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: .9rem; }
.club { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.club > .hd { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
.club > .hd b { font-size: 1.1rem; }
.club > .hd small { display: block; color: var(--muted); }
.club .bd { border-top: 1px solid var(--line); padding: 14px 16px; display: grid; gap: 14px; }
.club.pending { border-color: var(--flag); }
.right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.cred { font-family: var(--f-mono); font-size: .85rem; white-space: nowrap; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row input { flex: 1; min-width: 160px; width: auto; }
.btn.sm { padding: 5px 10px; font-size: .85rem; }
.sub { font: 700 .72rem var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: .92rem; }
.li:first-of-type { border-top: 0; }
.li small { color: var(--muted); }
.pill.wait { background: var(--flag); color: var(--on-flag); }
.pill.ok { background: var(--ok); color: #fff; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; z-index: 9; }
#gate { max-width: 380px; margin: 60px auto; }
</style>
</head>
<body>
<header class="topbar"><div class="in"><h1><img src="/golf/brand/wide-on-dark.svg" alt="Flagcast"> Admin</h1><button class="btn" id="lock" hidden>Lock</button></div></header>

<form id="gate" class="box" hidden>
  <h2>Flagcast Admin</h2>
  <label>Admin passcode<input id="pass" type="password" autocomplete="current-password" required></label>
  <label style="display:flex;gap:8px;align-items:center;flex-direction:row"><input type="checkbox" id="remember" style="width:auto"> Remember on this computer</label>
  <button class="btn primary" style="width:100%">Open</button>
  <div class="err" id="gErr" role="alert"></div>
</form>

<main id="app" hidden>
  <div class="warn" id="nomail" hidden>Emails aren’t set up yet (no RESEND_API_KEY on the flagcast worker), so clubs can’t get sign-in codes. You can still set clubs up and make tournaments for them here.</div>
  <div class="grid">
    <section>
      <div class="row" style="margin-bottom:12px"><input id="q" type="search" placeholder="Find a club"><select id="filter" style="width:auto"><option value="">All clubs</option><option value="pending">Waiting for approval</option><option value="active">Active</option><option value="off">Switched off</option></select></div>
      <div id="clubs"></div>
    </section>
    <aside>
      <form class="box" id="newClub">
        <h2>Set up a club</h2>
        <label>Club name<input id="cName" required placeholder="Willow Creek Country Club"></label>
        <label>Owner’s email<input id="cEmail" type="email" placeholder="pro@willowcreek.com"></label>
        <label>Town and state<input id="cCity" placeholder="Rye, NY"></label>
        <label>Tournaments they can make<select id="cCredits"><option value="0">None yet</option><option value="1" selected>1</option><option value="2">2</option><option value="5">5</option><option value="10">10</option><option value="-1">Unlimited (season)</option></select></label>
        <button class="btn primary" style="width:100%">Set up club</button>
        <p class="help" style="margin:8px 0 0">The owner gets an email telling them to download Flagcast Manager and sign in.</p>
        <div class="err" id="nErr" role="alert"></div>
      </form>
      <div class="box"><h2>Totals</h2><div id="totals" class="help" style="margin:0"></div></div>
    </aside>
  </div>
</main>
<div class="toast" id="toast" hidden></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KEY = 'flagcast:admin-pass';
let pass = (() => { try { return localStorage.getItem(KEY) || sessionStorage.getItem(KEY) || ''; } catch { return ''; } })();
let clubs = [], open = new Set();
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2600); }

async function admin(body) {
  const r = await fetch('/golf/api/club/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pass, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 403 && !body.op) throw Object.assign(new Error(j.error || 'That passcode is not right.'), { gate: true });
  if (!r.ok) throw new Error(j.error || 'That didn’t work.');
  clubs = j.clubs; $('nomail').hidden = j.mail; draw();
  return j;
}
const credText = (n) => (n < 0 ? 'Unlimited' : `${n} left`);
const date = (t) => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

function draw() {
  const q = $('q').value.trim().toLowerCase(), f = $('filter').value;
  const list = clubs.filter((c) => (!f || c.status === f) && (!q || `${c.name} ${c.city} ${c.members.map((m) => m.email).join(' ')}`.toLowerCase().includes(q)));
  $('clubs').innerHTML = list.length ? list.map((c) => {
    const pill = c.status === 'pending' ? '<span class="pill wait">Waiting</span>' : c.status === 'active' ? '<span class="pill ok">Active</span>' : '<span class="pill off">Off</span>';
    const evs = c.events;
    return `<div class="club ${c.status}" data-club="${c.id}">
      <div class="hd" data-toggle><div><b>${esc(c.name)}</b><small>${esc([c.city, c.contact, c.phone].filter(Boolean).join(' · '))}${c.city || c.contact || c.phone ? ' · ' : ''}since ${date(c.created)}</small></div>
        <div class="right"><span class="cred">${credText(c.credits)}</span><span class="cred">${evs.length} made</span>${pill}</div></div>
      ${open.has(c.id) ? `<div class="bd">
        <div class="row">${c.status === 'pending' ? '<button class="btn primary sm" data-op="approve">Approve</button>' : c.status === 'active' ? '<button class="btn sm danger" data-op="off">Switch off</button>' : '<button class="btn sm" data-op="on">Switch on</button>'}
          ${evs.length ? '' : '<button class="btn sm danger" data-op="delete">Delete club</button>'}</div>
        <div><div class="sub">Tournaments they can make · ${credText(c.credits)}</div>
          <div class="row"><button class="btn sm" data-credits="1">+1</button><button class="btn sm" data-credits="5">+5</button><button class="btn sm" data-credits="-1">−1</button><button class="btn sm" data-set="-1">Unlimited</button><button class="btn sm" data-set="0">None</button></div></div>
        <div><div class="sub">People</div>${c.members.length ? c.members.map((m) => `<div class="li"><span>${esc(m.email)} <small>${m.role}</small></span><button class="btn sm danger" data-rm="${esc(m.email)}">Remove</button></div>`).join('') : '<p class="help" style="margin:0">Nobody yet. Add the owner’s email.</p>'}
          <form class="row" data-invite style="margin-top:8px"><input type="email" required placeholder="name@club.com"><button class="btn sm">Add person</button></form></div>
        <div><div class="sub">Tournaments</div>${evs.length ? evs.map((e) => `<div class="li" style="${e.hidden ? 'opacity:.5' : ''}"><span>${esc(e.name)} <small>${e.id.toUpperCase()} · ${date(e.created)}${e.hidden ? ' · hidden by club' : ''}</small></span><span class="row"><a class="btn sm dark" href="/g/${e.id}/desk#${e.key}" target="_blank" rel="noopener">Desk</a><a class="btn sm" href="/g/${e.id}" target="_blank" rel="noopener">Live</a></span></div>`).join('') : '<p class="help" style="margin:0">None yet.</p>'}
          <form class="row" data-event style="margin-top:8px"><input required placeholder="Tournament name, e.g. 2027 Member-Guest"><button class="btn sm primary">Make for this club</button></form>
          <p class="help" style="margin:6px 0 0">Making one here doesn’t use the club’s credits.</p></div>
      </div>` : ''}</div>`;
  }).join('') : `<div class="box help">${clubs.length ? 'No clubs match.' : 'No clubs yet. Set one up on the right, or wait for clubs to ask from flagcast.app/golf.'}</div>`;
  const act = clubs.filter((c) => c.status === 'active').length, wait = clubs.filter((c) => c.status === 'pending').length;
  $('totals').innerHTML = `${clubs.length} clubs · ${act} active${wait ? ` · <b>${wait} waiting</b>` : ''}<br>${clubs.reduce((n, c) => n + c.events.length, 0)} tournaments made`;
}

$('clubs').addEventListener('click', async (e) => {
  const el = e.target.closest('[data-club]'); if (!el) return;
  const club = el.dataset.club;
  if (e.target.closest('[data-toggle]')) { open.has(club) ? open.delete(club) : open.add(club); return draw(); }
  const b = e.target.closest('button'); if (!b || b.form) return;
  try {
    if (b.dataset.op === 'delete' && !confirm('Delete this club? This can’t be undone.')) return;
    if (b.dataset.op) { await admin({ op: b.dataset.op, club }); toast(b.dataset.op === 'approve' ? 'Approved. They’ve been emailed.' : 'Done.'); }
    if (b.dataset.credits) await admin({ op: 'credits', club, add: Number(b.dataset.credits) });
    if (b.dataset.set) await admin({ op: 'credits', club, set: Number(b.dataset.set) });
    if (b.dataset.rm) await admin({ op: 'uninvite', club, email: b.dataset.rm });
  } catch (x) { toast(x.message); }
});
$('clubs').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target, club = f.closest('[data-club]').dataset.club, v = f.querySelector('input').value.trim();
  try {
    if (f.hasAttribute('data-invite')) { await admin({ op: 'invite', club, email: v }); toast('Added. They’ve been emailed.'); }
    if (f.hasAttribute('data-event')) { const j = await admin({ op: 'event', club, name: v }); toast('Tournament made. It’s in the club’s Manager now.'); if (j.made) window.open(`/g/${j.made.id}/desk#${j.made.key}&setup`, '_blank', 'noopener'); }
  } catch (x) { toast(x.message); }
});
$('newClub').addEventListener('submit', async (e) => {
  e.preventDefault(); $('nErr').textContent = '';
  try {
    const j = await admin({ op: 'create', name: $('cName').value, email: $('cEmail').value, city: $('cCity').value, credits: Number($('cCredits').value) });
    if (j.made) open.add(j.made.club); draw();
    $('cName').value = $('cEmail').value = $('cCity').value = ''; toast('Club set up.');
  } catch (x) { $('nErr').textContent = x.message; }
});
$('q').oninput = draw; $('filter').onchange = draw;

async function start() {
  try { await admin({}); $('gate').hidden = true; $('app').hidden = false; $('lock').hidden = false; }
  catch (x) { $('gate').hidden = false; $('app').hidden = true; $('lock').hidden = true; if (pass) $('gErr').textContent = x.message; }
}
$('gate').addEventListener('submit', async (e) => {
  e.preventDefault(); $('gErr').textContent = ''; pass = $('pass').value;
  try { ($('remember').checked ? localStorage : sessionStorage).setItem(KEY, pass); } catch {}
  await start();
});
$('lock').onclick = () => { try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch {} pass = ''; $('pass').value = ''; start(); };
start();
setInterval(() => { if (!$('app').hidden && document.visibilityState === 'visible') admin({}).catch(() => {}); }, 60000);
</script>
</body>
</html>
