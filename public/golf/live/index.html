<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123628">
<title>Leaderboard · Flagcast</title>
<link rel="icon" href="/golf/brand/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/golf/brand/app-icon-180.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/golf/golf.css">
<style>
.hdr { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.hdr h1 { font-size: 1.7rem; }
.hdr .label { margin-top: 4px; display: block; }
nav.tabs { display: flex; gap: 2px; background: var(--green); padding: 0 max(12px, env(safe-area-inset-left, 0px)); overflow-x: auto; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--green); }
nav.tabs button { background: none; border: 0; color: var(--on-green-muted); padding: 10px 12px; font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button[aria-pressed="true"] { color: var(--on-green); border-color: var(--flag); }
main { max-width: 720px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-left, 0px)) 40px max(16px, env(safe-area-inset-right, 0px)); }
.fund { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
.fund .row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .9rem; }
.fund .amt { font-family: var(--f-display); font-size: 1.6rem; font-weight: 800; }
.fund .bar { height: 10px; background: var(--paper-2); border-radius: 5px; overflow: hidden; margin-top: 8px; }
.fund .bar i { display: block; height: 100%; background: var(--red); }
.flights { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.flights button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 14px; min-height: 38px; font-size: .9rem; }
.flights button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.lb { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-variant-numeric: tabular-nums; }
.lb th { text-align: left; font-family: var(--f-mono); font-weight: 500; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.lb td { padding: 10px; border-bottom: 1px solid var(--line); }
.lb tr.r { cursor: pointer; }
.lb .pos { font-family: var(--f-mono); color: var(--muted); width: 3em; }
.lb .nm b { display: block; font-weight: 600; }
.lb .nm span { font-size: .78rem; color: var(--muted); }
.lb .num { text-align: right; font-family: var(--f-mono); font-weight: 600; white-space: nowrap; }
.lb .tp { font-size: 1.15rem; }
.lb tr.open td { background: var(--paper-2); }
.cardrow td { padding: 0 !important; background: var(--paper-2); }
.cardrow .wrap { overflow-x: auto; padding: 8px 10px 12px; }
.cardrow table { border-collapse: collapse; font-family: var(--f-mono); font-size: .74rem; }
.cardrow th, .cardrow td { padding: 3px 3px; text-align: center; border: 0 !important; }
.cardrow th:first-child, .cardrow td:first-child { text-align: left; font-family: var(--f-body); padding-right: 8px; white-space: nowrap; }
.cardrow .sc { min-width: 1.7em; height: 1.7em; }
.p3 { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 16px; scroll-margin-top: 60px; }
.p3 .cam { position: relative; aspect-ratio: 16 / 9; background: #0a120e; }
.p3 .cam video, .p3 .cam iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.p3 .cam .none { position: absolute; inset: 0; display: grid; place-items: center; color: #a9bdb0; font-size: .9rem; background: linear-gradient(180deg, #1d4a35, #123628); }
.p3 .cam .tag { position: absolute; left: 8px; top: 8px; background: #c8312b; color: #fff; font-family: var(--f-mono); font-size: .62rem; letter-spacing: .1em; padding: 2px 6px; border-radius: 2px; z-index: 2; }
.p3 .cam .tag.rp { background: var(--flag); color: var(--on-flag); }
.p3 .cam .camctl { position: absolute; right: 8px; top: 8px; display: flex; gap: 6px; z-index: 2; }
.p3 .cam .camctl button { background: rgba(0,0,0,.6); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 6px; padding: 4px 9px; font: 600 .75rem var(--f-body); }
.p3 .cam .camctl button.on { background: #c8312b; border-color: #c8312b; }
.p3 .cam .rmsg { position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(0,0,0,.7); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: .85rem; z-index: 2; }
.p3 .reps { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
.p3 .reps button { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 12px; font-size: .85rem; font-weight: 600; }
.p3 .reps button small { color: var(--muted); font-weight: 500; margin-left: 4px; }
.p3 .body { padding: 14px; }
.camsec { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); margin: 18px 2px 8px; }
.camsec:first-child { margin-top: 0; }
.camchips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
.camchips button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; font-size: .86rem; font-weight: 600; white-space: nowrap; }
.camchips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.latest { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.latest button { flex: 0 0 150px; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 10px; font-size: .84rem; line-height: 1.3; }
.latest button b { display: block; font-weight: 600; }
.latest button small { color: var(--muted); }
.latest button i { font-style: normal; background: var(--flag); color: var(--on-flag); font: 700 .6rem var(--f-mono); padding: 1px 5px; border-radius: 2px; margin-right: 5px; }
.p3 .who { display: inline-block; background: var(--flag); color: var(--on-flag); font: 700 .66rem var(--f-mono); letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; margin-bottom: 6px; }
.p3.mini h2 { font-size: 1.4rem; }
.p3 h2 { font-size: 1.8rem; }
.p3 .facts { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.stats b { display: block; font-family: var(--f-display); font-size: 1.6rem; }
.stats span { font-family: var(--f-mono); font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ct { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
.ct h3 { font-size: 1.15rem; }
.ct .sp { font-size: .8rem; color: var(--muted); }
.ct i.wait { font-style: normal; color: #d9a43a; } .ct i.okd { font-style: normal; color: #3aa76d; }
.ct ol { margin: 8px 0 0; padding-left: 20px; }
.ct li { display: list-item; padding: 3px 0; }
.ct li span { float: right; font-family: var(--f-mono); }
.sponsors { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 28px; }
.sponsors div { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; text-align: center; font-weight: 600; min-height: 64px; display: grid; place-items: center; }
.sponsors img { max-width: 100%; max-height: 44px; }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
.flash { background: var(--flag); color: var(--on-flag); padding: 10px 16px; text-align: center; font-weight: 600; }
.has-club .topbar { border-bottom: 3px solid var(--club, transparent); }
.topbar img.clublogo { height: 36px !important; }
/* the club's cover photo behind the title */
.topbar.photo { background: linear-gradient(rgba(0, 0, 0, .25), rgba(0, 0, 0, .7)), var(--cover) center / cover no-repeat, var(--green); padding-top: 46px; }
.topbar.photo .label { color: rgba(255, 255, 255, .85); }
.cupbox { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.cupbox b { font-family: var(--f-display); font-size: 2rem; line-height: 1; margin: 0 8px; }
.cupbox > div:last-child { text-align: right; }
.cupbox .ca { color: #d9534f; font-weight: 700; text-transform: uppercase; } .cupbox .cb { color: #3d7be0; font-weight: 700; text-transform: uppercase; }
.cupbox .mid { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); text-align: center; line-height: 1.4; }
.mlist { display: grid; gap: 6px; }
.mrow { display: grid; grid-template-columns: 22px 1fr 84px 1fr; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-height: 50px; }
.mrow .n { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); text-align: center; }
.mrow .t { padding: 6px 8px; font-weight: 600; font-size: .92rem; } .mrow .t.z { text-align: right; } .mrow .t.lo { color: var(--muted); font-weight: 500; }
.mrow .res { align-self: stretch; display: grid; place-content: center; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; line-height: 1.05; background: color-mix(in srgb, var(--muted) 18%, transparent); }
.mrow .res small { font-family: var(--f-mono); font-size: .6rem; font-weight: 500; opacity: .85; }
.mrow .res.mA { background: #c94a43; color: #fff; } .mrow .res.mB { background: #3b72d1; color: #fff; } .mrow .res.mL { background: var(--flag); color: var(--on-flag); }
.mrow.done .res { box-shadow: inset 0 0 0 3px var(--txt, #fff); }
.powered { font-size: 11px; letter-spacing: .08em; color: var(--muted); text-align: center; padding: 18px 0 6px; }
</style>
</head>
<body>
<header class="topbar"><div class="hdr"><div><img data-brand src="/golf/brand/wide-on-dark.svg" alt="Flagcast" style="height:24px;width:auto;max-width:60vw;object-fit:contain;object-position:left;display:block;margin-bottom:6px"><h1 id="title">Leaderboard</h1><span class="label" id="sub"></span></div><span class="pill live pulse" id="pill">LIVE</span></div></header>
<div class="flash" id="flash" hidden></div>
<nav class="tabs" id="tabs"><button data-v="lb" aria-pressed="true">Leaderboard</button><button data-v="in" aria-pressed="false" hidden>Individuals</button><button data-v="p3" aria-pressed="false">Live</button><button data-v="ct" aria-pressed="false">Contests</button><button data-v="sk" aria-pressed="false" hidden>Skins</button></nav>
<main id="main"><div class="empty">Loading the leaderboard…</div></main>
<p class="powered" data-powered hidden>POWERED BY FLAGCAST</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script type="module">
import { leaderboard, fmtPar, holeStats, contestLeader, fmtDist, skins, mark, FORMATS, formatName, teamBall, matches, cup, fmtPts, individuals, hasIndividuals, camList, CAM_KINDS } from '/golf/core.js';
import { live, esc } from '/golf/client.js';
import { appBar, remember } from '/golf/appbar.js';
import { attach, detach, playReplay, rewind, goLive, replayTime } from '/golf/replay.js';
import { phoneBanner } from '/golf/phonecast.js';
import { applyBrand } from '/golf/brandmark.js';
appBar('live');

const HV = (location.hash.match(/^#v=(\w+)/) || [])[1];
let S = null, view = location.hash.startsWith('#hole-') ? 'p3' : ['lb', 'in', 'p3', 'ct', 'sk'].includes(HV) ? HV : 'lb', flight = '', openRow = null, imode = '';
// a page routed to every phone: jump there when the player taps the banner
function goRoute(r) {
  const v = r.k === 'cam' || r.k === 'p3' ? 'p3' : r.k === 'contests' ? 'ct' : r.k === 'skins' ? 'sk' : r.k === 'indiv' ? 'in' : 'lb';
  if (r.k === 'lb' || r.k === 'indiv') flight = r.fl || '';
  view = v; render(); scrollTo(0, 0);
  if (v === 'p3') setTimeout(() => document.getElementById(`hole-${r.hole}`)?.scrollIntoView({ behavior: 'smooth' }), 50);
}
const $ = (id) => document.getElementById(id);

function camHtml(url, n) {
  if (!url) return `<div class="none">${n ? 'No camera on this hole' : 'No camera'}</div>`;
  if (/\.m3u8(\?|$)/.test(url)) return `<video muted playsinline autoplay controls data-hls="${esc(url)}"></video><span class="tag" data-tag>LIVE</span><div class="camctl"><button data-rw="${n}" aria-label="Back 30 seconds">⟲ 30s</button><button data-golive="${n}" class="on">Live</button></div>`;
  return `<iframe src="${esc(url)}" allow="autoplay; fullscreen" allowfullscreen title="${n ? `Hole ${n}` : 'Clubhouse'} camera"></iframe><span class="tag">LIVE</span>`;
}

// match play: every match as it stands, the team cup on top
function matchView() {
  const T = Object.fromEntries(S.teams.map((t) => [t.id, t])), nm = (id) => esc(T[id] ? T[id].name || T[id].players.map((p) => p.name.trim().split(/\s+/).pop()).join(' / ') : '');
  const list = matches(S, S.scores), c = cup(S, S.scores, list);
  if (!list.length) return `<div class="empty">The matches show here once the desk pairs the teams.</div>`;
  const col = (r) => { const w = r.winner || r.leader; if (!w) return ''; const id = w === 'A' ? r.a : r.b; return c.on ? (T[id]?.side === 'B' ? 'mB' : T[id]?.side === 'A' ? 'mA' : `m${w}`) : 'mL'; };
  const cupHtml = c.on ? `<div class="cupbox"><div><span class="ca">${esc(c.a)}</span><b>${fmtPts(c.A)}</b></div><div class="mid">${c.left ? `If it finished now<br>${fmtPts(c.nowA)} – ${fmtPts(c.nowB)}` : 'Final'}<br>${fmtPts(c.toWin)} to win</div><div><b>${fmtPts(c.B)}</b><span class="cb">${esc(c.b)}</span></div></div>` : '';
  return cupHtml + `<div class="mlist">${list.map((r, i) => { const w = r.winner || r.leader;
    return `<div class="mrow ${r.done ? 'done' : ''}"><span class="n">${i + 1}</span><span class="t ${w === 'B' ? 'lo' : ''}">${nm(r.a)}</span><span class="res ${col(r)}">${r.done ? (r.halved ? 'Halved' : esc(r.text)) : r.started ? esc(r.text) : '—'}<small>${r.done ? 'final' : r.started ? `thru ${esc(r.thru)}` : esc(r.thru === '—' ? 'not started' : r.thru.toLowerCase())}</small></span><span class="t z ${w === 'A' ? 'lo' : ''}">${nm(r.b)}</span></div>`; }).join('')}</div>
    <p class="label" style="margin-top:10px">${esc(formatName(S))} · ${S.format.show === 'gross' ? 'gross' : 'net'}${S.locked ? ' · final results' : ''}</p>`;
}
// Individuals (club championships): every player on their own, net or gross, by flight
function indivView() {
  const stab = S.format.type === 'stableford', mode = imode || S.format.show || 'net';
  const lb = individuals(S, S.scores, { flight: flight || undefined, mode });
  const other = stab ? [] : individuals(S, S.scores, { flight: flight || undefined, mode: mode === 'gross' ? 'net' : 'gross' });
  const fl = S.flights.length > 1 ? `<div class="flights">${['', ...S.flights].map((f) => `<button data-fl="${esc(f)}" aria-pressed="${f === flight}">${f ? `Flight ${esc(f)}` : 'All'}</button>`).join('')}</div>` : '';
  const md = stab ? '' : `<div class="flights">${['net', 'gross'].map((m) => `<button data-im="${m}" aria-pressed="${m === mode}">${m === 'net' ? 'Net' : 'Gross'}</button>`).join('')}</div>`;
  if (!lb.length) return md + fl + `<div class="empty">No players yet.</div>`;
  const o = (l) => { const x = other.find((y) => y.key === l.key); return x && x.played ? fmtPar(x.score) : '—'; };
  return md + fl + `<table class="lb"><thead><tr><th>Pos</th><th>Player</th><th class="num">${stab ? 'Pts' : mode === 'gross' ? 'Gross' : 'Net'}</th>${stab ? '' : `<th class="num">${mode === 'gross' ? 'Net' : 'Gross'}</th>`}<th class="num">Thru</th></tr></thead><tbody>${lb.map((l) => `
    <tr><td class="pos">${esc(l.pos)}</td><td class="nm"><b>${esc(l.name)}</b>${l.sub && l.sub !== l.name ? `<span>${esc(l.sub)}${S.flights.length > 1 && !flight && l.flight ? ` · Flight ${esc(l.flight)}` : ''}</span>` : ''}</td>
    <td class="num tp ${!stab && l.played && l.score < 0 ? 'under' : ''}">${l.played ? fmtPar(l.score, stab).replace(' pts', '') : '—'}</td>${stab ? '' : `<td class="num" style="color:var(--muted)">${o(l)}</td>`}<td class="num">${esc(l.thru)}</td></tr>`).join('')}</tbody></table>
    <p class="label" style="margin-top:10px">Every player on their own · ${stab ? 'points' : `ranked by ${mode}`}${S.locked ? ' · final results' : ''}</p>`;
}

function lbView() {
  if (S.format.type === 'match') return matchView();
  const stab = S.format.type === 'stableford';
  const lb = leaderboard(S, S.scores, { flight: flight || undefined });
  const fund = S.fund?.on ? `<div class="fund"><div class="row"><span>${esc(S.fund.label || 'Raised today')}</span>${S.fund.give ? `<a href="${esc(S.fund.give)}" target="_blank" rel="noopener">Give now</a>` : ''}</div>
    <div class="amt">$${Math.round(S.fund.raised).toLocaleString()}${S.fund.goal ? `<span class="label" style="font-family:var(--f-mono)"> of $${Math.round(S.fund.goal).toLocaleString()}</span>` : ''}</div>${S.fund.goal ? `<div class="bar"><i style="width:${Math.min(100, S.fund.raised / S.fund.goal * 100)}%"></i></div>` : ''}</div>` : '';
  const fl = S.flights.length > 1 ? `<div class="flights">${['', ...S.flights].map((f) => `<button data-fl="${esc(f)}" aria-pressed="${f === flight}">${f ? `Flight ${esc(f)}` : 'All'}</button>`).join('')}</div>` : '';
  if (!lb.length) return fund + fl + `<div class="empty">No teams yet.</div>`;
  return fund + fl + `<table class="lb"><thead><tr><th>Pos</th><th>${S.format.type === 'stroke' ? 'Player' : 'Team'}</th><th class="num">${stab ? 'Pts' : 'To par'}</th><th class="num">Thru</th></tr></thead><tbody>${lb.map((l) => `
    <tr class="r ${openRow === l.key ? 'open' : ''}" data-k="${esc(l.key)}"><td class="pos">${esc(l.pos)}</td><td class="nm"><b>${esc(l.name)}</b>${l.sub && l.sub !== l.name ? `<span>${esc(l.sub)}</span>` : ''}</td>
    <td class="num tp ${!stab && l.played && l.score < 0 ? 'under' : ''}">${l.played ? fmtPar(l.score, stab).replace(' pts', '') : '—'}</td><td class="num">${esc(l.thru)}</td></tr>
    ${openRow === l.key ? `<tr class="cardrow"><td colspan="4"><div class="wrap">${cardTable(l)}</div></td></tr>` : ''}`).join('')}</tbody></table>
    <p class="label" style="margin-top:10px">${esc(formatName(S))} · ${stab ? 'points' : S.format.show === 'gross' ? 'gross' : 'net'}${S.locked ? ' · final results' : ''} · tap a team for its card</p>`;
}

function cardTable(l) {
  const H = S.course.holes, t = l.team, scr = teamBall(S);
  const who = scr ? [{ id: 'T', name: t.name || 'Team' }] : t.players;
  const sc = S.scores[l.teamId] || {};
  return `<table><tr><th>Hole</th>${H.map((h) => `<th>${h.n}</th>`).join('')}</tr><tr><th>Par</th>${H.map((h) => `<th>${h.par}</th>`).join('')}</tr>
    ${who.map((p) => `<tr><td>${esc(p.name)}</td>${H.map((h, i) => { const v = (sc[p.id] || [])[i]; return `<td>${v == null ? '' : v === 0 ? 'PU' : `<span class="sc ${mark(v, h.par)}">${v}</span>`}</td>`; }).join('')}</tr>`).join('')}</table>`;
}

function contestBox(c) {
  const l = contestLeader(c);
  return `<div class="ct"><h3>${esc(c.label || (c.kind === 'ld' ? 'Long drive' : 'Closest to the pin'))} · Hole ${c.hole}</h3>${c.sponsor ? `<div class="sp">Presented by ${esc(c.sponsor)}</div>` : ''}
    ${l.length ? `<ol>${l.slice(0, 5).map((e) => `<li>${esc(e.name)} <span>${fmtDist(c, e.dist)}${e.ok === false ? ' <i class="wait" title="Waiting for the pro to check it">◷</i>' : e.by === 'golfer' ? ' <i class="okd" title="Checked">✓</i>' : ''}</span></li>`).join('')}</ol>` : '<p class="sp" style="margin:6px 0 0">No one on the board yet.</p>'}
    ${c.prize ? `<p class="sp" style="margin:6px 0 0">Winner gets ${c.prize.toLocaleString()} points</p>` : ''}</div>`;
}

// the Cameras tab: the newest replays, then every camera staff show golfers (the pro's phone, contest holes, par 3s,
// around the club), then the par 3s with no camera. With no cameras at all it's the Par 3s tab, as before.
let camKind = '';
function p3Card(h, cam) {
  const n = h ? h.n : 0, st = h ? holeStats(S, S.scores, n) : null, sp = h && S.sponsors.find((s) => s.holes.includes(n));
  const title = cam ? cam.title : `Hole ${n}`;
  const facts = h ? `Par ${h.par}${h.yds ? ` · ${h.yds} yds` : ''} · SI ${h.hcp}${st.avg ? ` · avg ${st.avg.toFixed(2)}` : ''}${sp ? ` · presented by ${esc(sp.name)}` : ''}` : '';
  const stats = h && h.par === 3 ? `${st.aces.length ? `<p style="margin:10px 0 0;font-weight:600" class="under">Hole in one: ${st.aces.map((a) => esc(a.name)).join(', ')}</p>` : ''}
      <div class="stats"><div><b>${st.aces.length}</b><span>Aces</span></div><div><b>${st.birdie + st.eagle - st.aces.length}</b><span>Birdies</span></div><div><b>${st.par0}</b><span>Pars</span></div><div><b>${st.bogey + st.worse}</b><span>Over</span></div></div>` : '';
  return `<article class="p3" id="hole-${n}"><div class="cam">${camHtml(cam ? cam.url : '', n)}</div><div class="body">
      ${repsHtml(n)}${cam && cam.kind === 'pro' ? `<span class="who">● LIVE FROM THE PRO${cam.by ? ` · ${esc(cam.by.toUpperCase())}` : ''}</span>` : ''}<h2>${esc(title)}</h2>${facts ? `<div class="facts">${facts}</div>` : ''}
      ${stats}${h ? S.contests.filter((c) => c.hole === n).map(contestBox).join('') : ''}</div></article>`;
}
function p3View() {
  const cams = camList(S), holes = S.course.holes, shown = new Set(cams.map((c) => c.n));
  const bare = holes.filter((h) => h.par === 3 && !shown.has(h.n) && !(S.cams[h.n] && (S.camsOff || []).includes(h.n)));
  if (!cams.length && !bare.length) return `<div class="empty">No cameras or par 3s for this course.</div>`;
  const kinds = [...new Set(cams.map((c) => c.kind))];
  if (camKind && !kinds.includes(camKind)) camKind = '';
  const chips = kinds.length > 1 ? `<div class="camchips"><button data-ck="" aria-pressed="${!camKind}">All</button>${kinds.map((k) => `<button data-ck="${k}" aria-pressed="${camKind === k}">${esc(k === 'club' ? 'Clubhouse' : CAM_KINDS[k])}</button>`).join('')}</div>` : '';
  const reps = (S.replays || []).filter((r) => shown.has(r.hole)).slice(0, 8);
  const latest = reps.length && !camKind ? `<div class="camsec">Latest replays</div><div class="latest">${reps.map((r) => `<button data-rep="${esc(r.id)}"><b><i>REPLAY</i>${esc(r.label || 'Replay')}</b><small>${r.hole ? `Hole ${r.hole}` : 'Clubhouse'} · ${replayTime(r)}</small></button>`).join('')}</div>` : '';
  const secs = kinds.filter((k) => !camKind || k === camKind).map((k) => `<div class="camsec">${esc(CAM_KINDS[k])}</div>` + cams.filter((c) => c.kind === k).map((c) => p3Card(holes[c.n - 1], c)).join('')).join('');
  const rest = bare.length && (!camKind || camKind === 'par3') ? `${cams.length ? `<div class="camsec">${kinds.includes('par3') ? 'More par 3s' : 'Par 3s'}</div>` : ''}${bare.map((h) => p3Card(h, null)).join('')}` : '';
  return chips + latest + secs + rest;
}

// replays of this hole, newest first
function repsHtml(n) {
  const list = (S.replays || []).filter((r) => r.hole === n).slice(0, 6);
  return list.length ? `<div class="reps">${list.map((r) => `<button data-rep="${esc(r.id)}">▶ ${esc(r.label || 'Replay')}<small>${replayTime(r)}</small></button>`).join('')}</div>` : '';
}
function startVideos(root) { for (const v of root.querySelectorAll('video[data-hls]')) attach(v, v.dataset.hls, { live: true }); }
const camShown = (n) => (S.camsOff || []).includes(n) ? '' : S.cams[n];
function backToLive(n) {
  const cam = document.querySelector(`#hole-${n} .cam`); if (!cam) return;
  cam.querySelectorAll('video').forEach(detach);
  cam.innerHTML = camHtml(camShown(n), n); startVideos(cam);
}
async function openReplay(id) {
  const r = (S.replays || []).find((x) => x.id === id); if (!r) return;
  const cam = document.querySelector(`#hole-${r.hole} .cam`); if (!cam) return;
  cam.closest('.p3').scrollIntoView({ behavior: 'smooth', block: 'start' });
  cam.querySelectorAll('video').forEach(detach);
  cam.innerHTML = `<video muted playsinline autoplay controls></video><span class="tag rp">REPLAY</span><div class="camctl"><button data-golive="${r.hole}">Back to live</button></div>${r.label ? `<div class="rmsg">${esc(r.label)}</div>` : ''}`;
  const res = await playReplay(cam.querySelector('video'), r, S.cams[r.hole], () => backToLive(r.hole));
  if (!res.ok) { const m = cam.querySelector('.rmsg') || cam.appendChild(Object.assign(document.createElement('div'), { className: 'rmsg' })); m.textContent = res.reason; }
}

function ctView() { return S.contests.length ? S.contests.map(contestBox).join('') : `<div class="empty">No contests in this tournament.</div>`; }
function skView() {
  return `<table class="lb"><thead><tr><th>Hole</th><th>Skin</th><th class="num">Score</th></tr></thead><tbody>${skins(S, S.scores).map((x) => `<tr><td class="pos">${x.hole}</td><td>${x.won ? `<b>${esc(x.won.name)}</b>${x.worth > 1 ? ` · ${x.worth} skins` : ''}` : x.tied ? 'Tied, carries over' : '<span class="label">Still playing</span>'}</td><td class="num">${x.score ?? ''}</td></tr>`).join('')}</tbody></table>`;
}

function render(keepVideo) {
  if (!S) return;
  $('title').textContent = S.screens?.title || S.name;
  const top = document.querySelector('.topbar'); top.classList.toggle('photo', !!S.photos?.cover);
  if (S.photos?.cover) top.style.setProperty('--cover', `url("${S.photos.cover}")`); else top.style.removeProperty('--cover');
  $('sub').textContent = [S.club, S.course.name && S.course.name !== S.club ? S.course.name : '', S.date].filter(Boolean).join(' · ');
  document.title = `${S.screens?.title || S.name} · Leaderboard`;
  $('flash').hidden = !(S.flash && Date.now() - S.flash.at < 30 * 60e3); if (S.flash) $('flash').textContent = S.flash.text;
  document.querySelector('[data-v="sk"]').hidden = !S.screens?.skins || teamBall(S);
  const inOn = !!S.format.indiv && hasIndividuals(S);
  document.querySelector('[data-v="in"]').hidden = !inOn; if (!inOn && view === 'in') view = 'lb';
  document.querySelector('[data-v="lb"]').textContent = S.format.type === 'match' ? 'Matches' : 'Leaderboard';
  document.querySelector('[data-v="p3"]').textContent = 'Live';
  for (const b of document.querySelectorAll('#tabs button')) b.setAttribute('aria-pressed', b.dataset.v === view);
  const camSig = view === 'p3' ? JSON.stringify([camList(S).map((c) => [c.n, c.url, c.kind, c.by]), camKind, (S.replays || []).slice(0, 8).map((r) => r.id)]) : '';
  if (view === 'p3' && keepVideo && document.querySelector('.p3') && camSig === render.camSig) { // update the numbers, keep the video playing
    const tmp = document.createElement('div'); tmp.innerHTML = p3View();
    tmp.querySelectorAll('.p3').forEach((n) => { const cur = document.getElementById(n.id); if (cur) cur.querySelector('.body').replaceWith(n.querySelector('.body')); });
    return;
  }
  const main = $('main');
  main.querySelectorAll('video').forEach(detach);
  render.camSig = camSig;
  main.innerHTML = view === 'p3' ? p3View() : view === 'ct' ? ctView() : view === 'sk' ? skView() : view === 'in' ? indivView() : lbView();
  startVideos(main);
  if (view === 'p3' && location.hash.startsWith('#hole-') && !render.jumped) { render.jumped = true; document.querySelector(location.hash)?.scrollIntoView(); }
}

document.addEventListener('click', (e) => {
  const tb = e.target.closest('#tabs button'); if (tb) { view = tb.dataset.v; render(); scrollTo(0, 0); return; }
  const fb = e.target.closest('[data-fl]'); if (fb) { flight = fb.dataset.fl; render(); return; }
  const im = e.target.closest('[data-im]'); if (im) { imode = im.dataset.im; render(); return; }
  const ck = e.target.closest('[data-ck]'); if (ck) { camKind = ck.dataset.ck; render(); return; }
  const rp = e.target.closest('[data-rep]'); if (rp) { openReplay(rp.dataset.rep); return; }
  const rw = e.target.closest('[data-rw]'); if (rw) { const v = rw.closest('.cam').querySelector('video'); if (v && !rewind(v, 30)) rw.textContent = 'Live only'; rw.nextElementSibling?.classList.remove('on'); return; }
  const gl = e.target.closest('[data-golive]'); if (gl) { const cam = gl.closest('.cam'); if (cam.querySelector('[data-tag]')) { const v = cam.querySelector('video'); if (v) goLive(v); gl.classList.add('on'); } else backToLive(Number(gl.dataset.golive)); return; }
  const r = e.target.closest('tr.r'); if (r) { openRow = openRow === r.dataset.k ? null : r.dataset.k; render(); }
});

live((s) => { const had = !!S; S = s; applyBrand(s); remember(s.name); render(had); phoneBanner(S, goRoute); }, (on) => { $('pill').textContent = on ? 'LIVE' : 'RECONNECTING'; $('pill').className = `pill ${on ? 'live pulse' : 'off'}`; });
</script>
</body>
</html>
