<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cart cards · Flagcast</title>
<link rel="icon" href="/golf/brand/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/golf/brand/app-icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/golf/golf.css">
<style>
/* Cart signs, the way most clubs do them: landscape, the club's logo and the tournament across the top, the players'
   names big enough to find your cart from the bag drop, and the starting hole in a box. Two a letter page (8 × 5 in,
   cut along the dashed line and slide into the cart's sign holder), or Big print, one a page in landscape.
   Always light, for paper, whatever the computer's own light or dark setting. */
:root { color-scheme: light; --paper: #fff; --ink: #14201a; --muted: #56625a; --line: #c9d1c5; }
body { background: #e9ece6; color: var(--ink); }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; background: var(--green); color: var(--on-green); }
.bar p { margin: 0; color: var(--on-green-muted); font-size: .9rem; }
.toggle { display: flex; gap: 8px; align-items: center; }
.sheet { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 16px; }
.card { --w: 8in; --h: 5in; width: min(100%, var(--w)); aspect-ratio: 8 / 5; font-size: 12pt; background: #fff; border: 1.5px dashed var(--line);
  padding: .28in .32in; display: grid; grid-template-rows: auto 1fr auto; gap: .14in; break-inside: avoid; box-sizing: border-box; overflow: hidden; }
/* the top: the club's logo (Flagcast's for a demo or a club with no logo), the tournament and its date, over a bar in the club's colour */
.head { display: flex; align-items: center; gap: .18in; border-bottom: .07in solid var(--club, var(--ink)); padding-bottom: .1in; }
.head img { height: 4.6em; width: auto; max-width: 13em; object-fit: contain; flex: none; }
.ev { flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 800; font-size: 2em; line-height: 1; text-transform: uppercase; }
.ev small { display: block; font-family: var(--f-mono); font-weight: 500; font-size: .36em; letter-spacing: .14em; color: var(--muted); margin-top: .35em; }
/* the middle: who rides here, big, and the starting hole in a box */
.mid { display: grid; grid-template-columns: 1fr auto; gap: .25in; align-items: center; min-height: 0; }
.team { font-family: var(--f-mono); font-size: .85em; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: .3em; }
.names { list-style: none; margin: 0; padding: 0; font-family: var(--f-display); font-weight: 800; text-transform: uppercase; line-height: 1.02; font-size: 3.6em; }
.names.n3 { font-size: 2.3em; } .names.n4 { font-size: 1.95em; } .names.n5 { font-size: 1.6em; }
.names li { overflow-wrap: anywhere; }
.start { border: .05in solid var(--ink); border-radius: .08in; text-align: center; padding: .08in .2in .1in; min-width: 1.5in; }
.start .k { font-family: var(--f-mono); font-size: .8em; letter-spacing: .22em; color: var(--muted); }
.start .hole { font-family: var(--f-display); font-weight: 800; font-size: 5.6em; line-height: .9; }
.start .sub { font-family: var(--f-display); font-weight: 700; font-size: 1.15em; text-transform: uppercase; }
.start .sub { border-top: 1px solid var(--line); margin-top: .06in; padding-top: .05in; white-space: nowrap; }
/* the bottom: scan to keep score */
.foot { display: flex; align-items: center; gap: .16in; border-top: 1px solid var(--line); padding-top: .1in; }
.qr svg { width: .95in; height: .95in; display: block; }
.how { flex: 1; font-size: .85em; line-height: 1.35; color: var(--muted); }
.how b { color: var(--ink); }
.code { font-family: var(--f-mono); font-size: 1.25em; font-weight: 600; letter-spacing: .16em; text-align: right; }
.code small { display: block; font-size: .5em; letter-spacing: .2em; color: var(--muted); font-weight: 500; }
/* Big print: one a page, landscape, everything about 40% bigger, to read from across the cart park */
.big .card { --w: 10.5in; --h: 8in; aspect-ratio: 10.5 / 8; font-size: 17pt; padding: .45in .5in; gap: .22in; }
.big .qr svg { width: 1.4in; height: 1.4in; }
@page { size: letter portrait; margin: .25in; }
@page sign { size: letter landscape; margin: .25in; }
@media print {
  body { background: #fff; }
  .bar { display: none; }
  .sheet { display: block; padding: 0; }
  .card { width: 8in; height: 5in; aspect-ratio: auto; margin: 0 auto .25in; }
  .card:nth-child(2n) { break-after: page; }
  .big .card { page: sign; width: 10.5in; height: 8in; margin: 0; break-after: page; }
}
</style>
</head>
<body>
<div class="bar"><div><h1 style="font-size:1.4rem">Cart cards</h1><p id="sub">Loading…</p></div><div class="toggle"><label style="display:flex;gap:6px;align-items:center;color:var(--on-green)"><input type="checkbox" id="big" style="width:auto"> Big print (one a page)</label><button class="btn primary" onclick="print()">Print</button></div></div>
<div class="sheet" id="sheet"></div>
<script src="/golf/qrcode.js"></script>
<script type="module">
import { post, eventId, esc, api } from '/golf/client.js';
const key = location.hash.slice(1).split('&')[0];
const sheet = document.getElementById('sheet');
// big print: four cards a page, or one big one (also with #…&big in the link)
const bigBox = document.getElementById('big');
const setBig = (on) => { document.body.classList.toggle('big', on); bigBox.checked = on; };
setBig(location.hash.includes('&big'));
bigBox.addEventListener('change', () => setBig(bigBox.checked));
try {
  // the desk has the cart codes; the public state has the branding golfers see (the club's logo and colour, or Flagcast's)
  const [ev, pub] = await Promise.all([post('desk', { key, op: 'get' }), fetch(api('state')).then((r) => r.json()).catch(() => ({}))]);
  const brand = pub.brand || {};
  if (brand.accent) document.documentElement.style.setProperty('--club', brand.accent);
  const logo = brand.logo
    ? `<img src="${esc(brand.logo)}" alt="${esc(brand.club || 'Club logo')}">`
    : '<img src="/golf/brand/wide-on-light.svg" alt="Flagcast">';
  const title = ev.screens?.title || ev.name;
  const when = [brand.club && brand.club !== title ? brand.club : '', ev.date].filter(Boolean).join(' · ');
  document.getElementById('sub').textContent = `${ev.teams.length} team${ev.teams.length === 1 ? '' : 's'} · ${title}. Cut along the dashed lines and slide one into each cart’s sign holder.`;
  sheet.innerHTML = ev.teams.map((t) => {
    const url = `${location.origin}/g/${eventId()}/s/${t.code}`;
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    const names = t.players.map((p) => p.name).filter(Boolean);
    const sub = [t.cart ? `Cart ${esc(t.cart)}` : '', t.flight ? `Flight ${esc(t.flight)}` : ''].filter(Boolean);
    return `<div class="card"><div class="head">${logo}<div class="ev">${esc(title)}${when ? `<small>${esc(when)}</small>` : ''}</div></div>
      <div class="mid"><div>${t.name ? `<div class="team">${esc(t.name)}</div>` : ''}
        <ul class="names n${Math.max(2, names.length)}">${names.map((n) => `<li>${esc(n)}</li>`).join('') || '<li>Team</li>'}</ul></div>
        <div class="start"><div class="k">START</div><div class="hole">${esc(t.start || 1)}</div><div class="k">HOLE</div>${sub.length ? `<div class="sub">${sub.join(' · ')}</div>` : ''}</div></div>
      <div class="foot"><div class="qr">${qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true })}</div>
        <div class="how"><b>Keep score on your phone.</b> Point your camera at the code and tap the link. No app, no sign-in. One person per cart keeps score, and the leaderboard and big screens update as you play.</div>
        <div class="code"><small>CART CODE</small>${esc(t.code)}</div></div></div>`;
  }).join('') || '<p>No teams yet. Add them on the desk’s Teams tab and save.</p>';
} catch (e) {
  sheet.innerHTML = `<p>${esc(e.message)}</p>`;
}
</script>
</body>
</html>
