<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard screen · Flagcast</title>
<link rel="icon" href="/golf/brand/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/golf/brand/app-icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/golf/golf.css">
<style>
/* Made for a 16:9 screen (TV, LED wall, or a browser source in Screens/OBS). Everything is sized in vw so it scales. */
:root { color-scheme: dark; --bg: #0a120e; --panel: #0d1a14; --row: #10201a; --rule: #1d3328; --txt: #eef3ec; --dim: #8fa596; --flag: #e8c547; --red: #ff6b5e; --green: #123628; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--txt); }
body { font-size: 1.1vw; cursor: none; }
.frame { position: absolute; inset: 0; display: grid; grid-template-rows: 5.4vw 1fr 3.2vw; }
header { display: flex; align-items: center; justify-content: space-between; gap: 2vw; padding: 0 2.4vw; background: var(--green); }
header h1 { font-size: 2.6vw; font-weight: 800; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .right { display: flex; align-items: center; gap: 1.4vw; font-family: var(--f-mono); font-size: 1.1vw; color: #a9bdb0; white-space: nowrap; }
header .pill { font-size: .9vw; padding: .2vw .7vw; }
.stage { position: relative; overflow: hidden; }
.camfull { position: absolute; inset: 0; }
.camfull .cam { position: absolute; inset: 0; border-radius: 0; }
.camfull .tag { font-size: 1.3vw; padding: .3vw 1vw; }
.camlow { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; align-items: stretch; }
.camlow .a { background: var(--green, #123628); color: #fff; padding: 1vw 2vw; }
.camlow .a h3 { font: 800 3vw var(--f-display); text-transform: uppercase; margin: 0; line-height: 1; }
.camlow .a p { margin: .2vw 0 0; color: #a9bdb0; font-size: 1.2vw; }
.camlow .b { background: var(--flag, #e8c547); color: #1a1a10; padding: 1vw 2vw; display: flex; flex-direction: column; justify-content: center; }
.camlow .b small { font: 600 .9vw var(--f-mono); letter-spacing: .1em; }
.camlow .b b { font-size: 1.9vw; }
.slide { position: absolute; inset: 0; padding: 1.8vw 2.4vw; opacity: 0; transition: opacity .6s ease; }
.slide.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .slide { transition: none; } }
.slide h2 { font-size: 3.4vw; font-weight: 800; letter-spacing: .02em; }
.slide .sub { font-family: var(--f-mono); font-size: 1vw; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: .5vw; }
/* leaderboard */
.lb { width: 100%; border-collapse: collapse; margin-top: 1.2vw; font-variant-numeric: tabular-nums; }
.lb th { font-family: var(--f-mono); font-weight: 500; font-size: .95vw; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); text-align: left; padding: .5vw 1vw; border-bottom: 2px solid var(--rule); }
.lb td { padding: 0 1vw; height: 4.6vw; border-bottom: 1px solid var(--rule); font-size: 1.9vw; }
.lb tr:nth-child(even) td { background: var(--row); }
.lb .pos { font-family: var(--f-mono); color: var(--dim); width: 6vw; }
.lb .name { font-weight: 700; font-size: 2vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; width: 100%; }
.lb .name small { display: block; font-weight: 500; font-size: 1vw; color: var(--dim); margin-top: -.2vw; }
.lb .num { text-align: right; font-family: var(--f-mono); font-weight: 600; width: 9vw; }
.lb .num.rnd { width: 7vw; color: var(--dim); font-weight: 500; }
.lb .tp { font-size: 2.3vw; }
.lb .fl { text-align: center; width: 6vw; font-family: var(--f-mono); color: var(--dim); }
.lb .moved td.name::after { content: "▲"; color: #59c98a; font-size: .9vw; margin-left: .6vw; vertical-align: .3vw; }
.under { color: var(--red); }
.page { position: absolute; right: 2.4vw; top: 2.3vw; font-family: var(--f-mono); font-size: 1vw; color: var(--dim); }
/* match play: two columns of matches, the leader's colour in the middle; a white ring when it's over */
.cupline { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1.6vw; margin: .6vw 0 .2vw; }
.cupline .sd { display: flex; align-items: baseline; gap: 1vw; font-family: var(--f-display); font-weight: 800; font-size: 2.2vw; text-transform: uppercase; }
.cupline .sd.l { justify-content: flex-end; }
.cupline .sd em { font-style: normal; font-size: 3.6vw; line-height: 1; color: var(--txt); }
.cupbar { height: .8vw; width: 26vw; border-radius: .4vw; position: relative; background: var(--cb); }
.cupbar::after { content: ""; position: absolute; left: 50%; top: -.35vw; bottom: -.35vw; width: .15vw; background: #fff; }
.cupnote { text-align: center; font-family: var(--f-mono); font-size: .95vw; color: var(--dim); }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: .6vw 1vw; margin-top: 1vw; }
.mt { display: grid; grid-template-columns: 1fr 9vw 1fr; align-items: center; background: var(--row); border-radius: .4vw; overflow: hidden; height: 3.9vw; font-size: 1.5vw; }
.mt .a, .mt .z { padding: 0 1vw; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mt .z { text-align: right; }
.mt .lo { color: var(--dim); font-weight: 500; }
.mt .s { height: 100%; display: grid; place-content: center; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 1.9vw; line-height: 1; background: #24352c; }
.mt .s small { display: block; font-family: var(--f-mono); font-weight: 500; font-size: .75vw; opacity: .85; margin-top: .2vw; }
.mt.done .s { box-shadow: inset 0 0 0 .22vw #fff; }
.mt .s.ld { background: var(--flag); color: #12160f; }
.mt .s.A { background: #c94a43; color: #fff; } .mt .s.B { background: #3b72d1; color: #fff; }
.lb .gr { color: var(--dim); }
/* par 3 */
.p3 { display: grid; grid-template-columns: 1.7fr 1fr; gap: 2vw; height: 100%; }
.cam { position: relative; background: #000; border-radius: .5vw; overflow: hidden; }
.cam video, .cam iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
.cam .tag { position: absolute; left: 1vw; top: 1vw; z-index: 2; background: #c8312b; color: #fff; font-family: var(--f-mono); font-size: .9vw; letter-spacing: .1em; padding: .2vw .7vw; border-radius: .2vw; }
.holeart { position: absolute; inset: 0; background: linear-gradient(180deg, #1d4a35, #123628); display: grid; place-items: center; }
.holeart svg { width: 70%; height: 80%; }
.p3info { display: flex; flex-direction: column; gap: 1.4vw; min-width: 0; }
.bignum { font-family: var(--f-display); font-weight: 800; font-size: 9vw; line-height: .85; }
.facts { font-family: var(--f-mono); font-size: 1.3vw; color: var(--dim); }
.facts b { color: var(--txt); }
.box { background: var(--panel); border: 1px solid var(--rule); border-radius: .5vw; padding: 1.2vw 1.4vw; }
.box h3 { font-size: 1.5vw; letter-spacing: .05em; color: var(--flag); margin-bottom: .6vw; }
.rows div { display: flex; justify-content: space-between; gap: 1vw; font-size: 1.5vw; padding: .35vw 0; border-bottom: 1px solid var(--rule); }
.rows div:last-child { border-bottom: 0; }
.rows span:last-child { font-family: var(--f-mono); white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; }
.stats b { display: block; font-family: var(--f-display); font-size: 3vw; line-height: 1; }
.stats span { font-family: var(--f-mono); font-size: .85vw; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.presented { font-size: 1.3vw; color: var(--dim); }
.presented b { color: var(--txt); }
/* contests, sponsors, fund */
.prize { margin-top: .6vw; color: var(--flag); font-size: 1.1vw; font-weight: 600; }
.ctfoot { margin-top: 1.4vw; opacity: .7; font-size: 1.1vw; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(28vw, 1fr)); gap: 1.6vw; margin-top: 1.6vw; }
.sponsors { display: grid; grid-template-columns: repeat(auto-fit, minmax(20vw, 1fr)); gap: 1.4vw; margin-top: 2vw; }
.sp { background: var(--panel); border: 1px solid var(--rule); border-radius: .5vw; height: 11vw; display: grid; place-items: center; text-align: center; padding: 1vw; }
.sp img { max-width: 80%; max-height: 7vw; }
.sp b { font-family: var(--f-display); font-size: 2.4vw; text-transform: uppercase; letter-spacing: .03em; }
.sp small { display: block; font-size: 1vw; color: var(--dim); margin-top: .3vw; }
.fund { display: grid; place-items: center; height: 100%; text-align: center; }
.fund .amt { font-family: var(--f-display); font-weight: 800; font-size: 12vw; line-height: .9; color: var(--flag); }
.fund .bar { width: 70vw; height: 2.2vw; background: var(--rule); border-radius: 1.1vw; overflow: hidden; margin: 2vw auto 1vw; }
.fund .bar i { display: block; height: 100%; background: var(--red); }
.fund p { font-size: 1.6vw; color: var(--dim); }
.skins { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1vw; margin-top: 1.6vw; }
.skins div { background: var(--panel); border: 1px solid var(--rule); border-radius: .4vw; padding: .8vw; min-height: 7vw; }
.skins b { font-family: var(--f-display); font-size: 1.8vw; }
.skins p { margin: .2vw 0 0; font-size: 1.05vw; color: var(--dim); }
.skins .won { border-color: var(--flag); }
.skins .won p { color: var(--txt); }
/* ticker and takeovers */
footer { display: flex; align-items: center; gap: 1.2vw; background: #07100c; border-top: 1px solid var(--rule); padding: 0 2.4vw; overflow: hidden; white-space: nowrap; font-size: 1.25vw; color: #c8d6cc; }
footer .tag { background: #c8312b; color: #fff; font-family: var(--f-mono); font-size: .85vw; letter-spacing: .1em; padding: .2vw .6vw; border-radius: .2vw; }
footer .run { overflow: hidden; flex: 1; }
.phone { display: grid; grid-template-columns: auto 1fr; gap: 4vw; align-items: center; height: 100%; padding: 0 6vw; }
.phone .qrbox { background: #fff; padding: 1.2vw; border-radius: 1vw; width: 30vw; height: 30vw; }
.phone .qrbox svg { width: 100%; height: 100%; display: block; }
.phone h2 { font-size: 6vw; line-height: .95; margin: .6vw 0 1.4vw; }
.phone p { font-size: 1.9vw; color: var(--dim); max-width: 46vw; line-height: 1.35; margin: 0 0 2vw; }
.phone .purl { font-family: var(--f-mono); font-size: 2.2vw; color: var(--flag); letter-spacing: .04em; }
footer .brandlogo { height: 3vw; width: auto; max-width: 16vw; object-fit: contain; flex: none; }
.has-club footer { border-top: .25vw solid var(--club, var(--rule)); }
footer .powered { font-family: var(--f-mono); font-size: .75vw; letter-spacing: .08em; color: var(--dim); flex: none; }
footer .run span { display: inline-block; padding-left: 100%; animation: tick 40s linear infinite; }
@keyframes tick { to { transform: translateX(-100%); } }
.take { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center; background: radial-gradient(circle at 50% 45%, #1d4a35, #07100c 75%); }
.take .k { font-family: var(--f-mono); font-size: 1.4vw; letter-spacing: .3em; color: var(--flag); }
.take h2 { font-size: 13vw; font-weight: 800; line-height: .85; margin: 1vw 0; color: var(--flag); }
.take p { font-size: 3vw; font-weight: 700; margin: 0; }
.take small { display: block; font-size: 1.6vw; color: var(--dim); margin-top: 1vw; }
.take.replay { background: #000; place-items: stretch; }
.take.replay video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.take.replay .rtag { position: absolute; left: 2.4vw; top: 2.4vw; background: var(--flag); color: var(--on-flag); font: 700 1.5vw var(--f-mono); letter-spacing: .2em; padding: .4vw 1vw; border-radius: .3vw; }
.take.replay .rlabel { position: absolute; left: 2.4vw; bottom: 2.4vw; right: 2.4vw; text-align: left; font: 800 3.4vw var(--f-display); text-transform: uppercase; color: #fff; text-shadow: 0 .2vw 1vw rgba(0,0,0,.8); }
.take.replay .bug { position: absolute; right: 2.4vw; top: 2.4vw; }
.take.msg h2 { font-size: 6vw; color: var(--txt); text-transform: none; }
.empty { display: grid; place-items: center; height: 100%; text-align: center; color: var(--dim); font-size: 1.8vw; }
/* sponsor spots */
header .tsp { font-family: var(--f-mono); font-size: 1vw; color: #a9bdb0; letter-spacing: .06em; white-space: nowrap; display: flex; align-items: center; gap: .6vw; }
header .tsp img { height: 2.6vw; width: auto; max-width: 12vw; object-fit: contain; }
header .tsp b { color: var(--txt); font-weight: 600; }
.lbsp { position: absolute; right: 2.4vw; top: 1.8vw; display: flex; align-items: center; gap: .8vw; font-family: var(--f-mono); font-size: .95vw; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
.lbsp img { height: 3vw; max-width: 14vw; object-fit: contain; }
.lbsp b { color: var(--txt); font-family: var(--f-body); text-transform: none; letter-spacing: 0; font-size: 1.2vw; }
.cam .bug { position: absolute; right: 1vw; top: 1vw; z-index: 2; display: flex; align-items: center; gap: .5vw; background: rgba(7,16,12,.72); color: var(--flag); font-family: var(--f-mono); font-size: .8vw; letter-spacing: .08em; padding: .3vw .6vw; border-radius: .3vw; }
.cam .bug img { height: 1.8vw; max-width: 8vw; object-fit: contain; }
.spone { display: grid; place-items: center; height: 100%; text-align: center; }
.spone .sub { margin-bottom: 1.4vw; }
.spone img { max-width: 50vw; max-height: 22vw; object-fit: contain; }
.spone b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 7vw; text-transform: uppercase; line-height: .9; }
.spone p { font-size: 2vw; color: var(--dim); margin: 1.4vw 0 0; }
.tier { font-family: var(--f-mono); font-size: .95vw; letter-spacing: .14em; text-transform: uppercase; color: var(--flag); margin: 1.6vw 0 -.8vw; }
.sched { margin-top: 2vw; display: grid; gap: .8vw; max-width: 70vw; }
.sched div { display: grid; grid-template-columns: 14vw 1fr; gap: 2vw; align-items: baseline; background: var(--panel); border: 1px solid var(--rule); border-radius: .5vw; padding: 1.2vw 1.6vw; font-size: 2.2vw; font-weight: 600; }
.sched time { font-family: var(--f-mono); color: var(--flag); font-size: 1.8vw; }
.take .tsponsor { margin-top: 2vw; font-family: var(--f-mono); font-size: 1.2vw; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; display: grid; justify-items: center; gap: .8vw; }
.take .tsponsor img { max-height: 6vw; max-width: 24vw; object-fit: contain; }
.take .tsponsor b { font-family: var(--f-body); font-size: 2vw; color: var(--txt); text-transform: none; letter-spacing: 0; }
</style>
</head>
<body>
<div class="frame">
  <header><h1 id="title">Leaderboard</h1><div class="tsp" id="tsp" hidden></div><div class="right"><span id="clock"></span><span class="pill live pulse" id="livepill">LIVE</span></div></header>
  <div class="stage" id="stage"><div class="empty">Loading the tournament…</div></div>
  <footer><span class="tag" id="tickTag">UPDATE</span><div class="run"><span id="ticker"></span></div><span class="powered" data-powered hidden>POWERED BY FLAGCAST</span><img class="brandlogo" data-brand src="/golf/brand/wide-on-dark.svg" alt="Flagcast"></footer>
</div>
<div class="take" id="take" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script src="/golf/qrcode.js"></script>
<script type="module">
import { leaderboard, board, indivBoard, showsTotal, multiRound, roundCount, roundNow, roundName, roundDay, holeStats, fmtPar, contestLeader, fmtDist, skins, FORMATS, formatName, matches, cup, fmtPts, individuals, hasIndividuals, camList, camTitle } from '/golf/core.js';
import { live, esc, post } from '/golf/client.js';
import { attach, detach, playReplay } from '/golf/replay.js';
import { applyBrand } from '/golf/brandmark.js';

// ?screen=grill (a screen from the Manager, with its own playlist)
// ?show=leaderboard,par3,contests,skins,sponsors,fund  ?hole=7 (one par 3 only, e.g. a TV at that tee)  ?flight=A  ?mode=gross
const q = new URLSearchParams(location.search);
const only = (q.get('show') || '').split(',').filter(Boolean);
const lockHole = Number(q.get('hole')) || 0;
// ?screen=<id>: this is one of the club's screens set up in the Manager; it plays that screen's playlist
const screenId = (q.get('screen') || '').toLowerCase();
let S = null, curEl = null, slides = [], idx = -1, timer = null, lastPos = {}, moved = new Set(), seenAces = null, seenFlash = null, seenTake = null, recent = [], forced = '';
const $ = (id) => document.getElementById(id);

setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }, 1000);

const spot = (k, hole) => (S.sponsors || []).filter((x) => x.spot === k && (!hole || x.holes.includes(hole)));
const spName = (x, cls = '') => x.logo ? `<img src="${esc(x.logo)}" alt="${esc(x.name)}"${cls}>` : `<b>${esc(x.name)}</b>`;
const display = () => (S.displays || []).find((d) => d.id === screenId);

// one playlist entry → the slides it makes (a leaderboard can be several pages)
function pageSlides(it) {
  const stab = S.format.type === 'stableford', rows = S.screens?.rows || 10, secs = it.secs;
  // match play: the leaderboard page is the matches board
  if (it.k === 'matches' || (it.k === 'lb' && isMatch())) return matchSlides(secs);
  if (it.k === 'indiv') return indivSlides(it.fl || null, secs);
  if (it.k === 'lb') {
    const lb = board(S, S.scores, { flight: it.fl || null, mode: q.get('mode') || undefined });
    if (!lb.length) return [];
    const pages = Math.max(1, Math.ceil(lb.length / rows)), out = [];
    for (let p = 0; p < Math.min(pages, 4); p++) out.push({ k: 'lb', fl: it.fl || null, lb: lb.slice(p * rows, p * rows + rows), p, pages, stab, secs });
    return out;
  }
  if (it.k === 'cam') { const h = it.hole === 0 ? (S.cams[0] ? { n: 0 } : null) : S.course.holes.find((x) => x.n === it.hole); return h ? [{ k: 'cam', h, secs }] : []; }
  if (it.k === 'p3') { const h = S.course.holes.find((x) => x.n === it.hole) || S.course.holes.find((x) => x.par === 3); return h ? [{ k: 'p3', h, secs }] : []; }
  if (it.k === 'sponsor') { const sp = (S.sponsors || []).find((x) => x.id === it.sponsor); return sp ? [{ k: 'sponsor', sp, secs }] : []; }
  if (it.k === 'fund' && !S.fund?.on) return [];
  if (it.k === 'skins' && !S.screens?.skins) return [];
  if (it.k === 'sponsors' && !(S.sponsors || []).length) return [];
  if (it.k === 'schedule' && !(S.schedule || []).length) return [];
  if (it.k === 'contests' && !(S.contests || []).length) return [];
  return [{ k: it.k, secs }];
}

// what the Manager or a pro sent to this screen, unless it was sent for a while (Send now for 5 or 15 minutes) and that's over
function activeForce() {
  const f = screenId && S.live?.force?.[screenId];
  return f && !(f.until && Date.now() >= f.until) ? f : null;
}
// a timed send ends on its own: back to the playlist without waiting for the next change
setInterval(() => { if (S && forced && !activeForce()) { idx = -1; advance(); } }, 5000);

function build() {
  // a pro or the Manager switched this screen to one page
  const f = activeForce();
  forced = f ? `${f.k}|${f.at}` : '';
  if (f) { const one = pageSlides({ ...f, secs: 3600 }); if (one.length) return one; }
  const d = display();
  if (d && d.playlist.length) { const out = d.playlist.flatMap(pageSlides); if (out.length) return withPhone(out); }
  const out = [], want = (k) => !only.length || only.includes(k);
  const stab = S.format.type === 'stableford', flights = q.get('flight') ? [q.get('flight')] : (S.flights.length > 1 ? S.flights : [null]);
  const rows = S.screens?.rows || 10;
  if (want('leaderboard') && !lockHole && isMatch()) out.push(...matchSlides());
  else if (want('leaderboard') && !lockHole) for (const fl of flights) {
    const lb = board(S, S.scores, { flight: fl, mode: q.get('mode') || undefined });
    if (!lb.length) continue;
    const pages = Math.max(1, Math.ceil(lb.length / rows));
    for (let p = 0; p < Math.min(pages, 4); p++) out.push({ k: 'lb', fl, lb: lb.slice(p * rows, p * rows + rows), p, pages, stab });
  }
  // the Individuals board (club championships): every player, gross and net, by flight
  if ((want('leaderboard') || want('individuals')) && !lockHole && S.format.indiv && hasIndividuals(S)) for (const fl of flights) out.push(...indivSlides(fl));
  const par3 = S.course.holes.filter((h) => h.par === 3 && (!lockHole || h.n === lockHole));
  if (want('par3') || lockHole) for (const h of par3) out.push({ k: 'p3', h });

function startVideo(root) {

}

const sig = (s) => `${s.k}|${s.h ? s.h.n : ''}|${s.fl || ''}|${s.p || 0}|${s.sp ? s.sp.id : ''}`;

function show(next) {
  const stage = $('stage');
  const old = curEl;
  const el = document.createElement('div');
  el.className = 'slide';
  el.innerHTML = draw(slides[next]);
  stage.appendChild(el);
  startVideo(el);
  void el.offsetWidth; // so the fade runs
  el.classList.add('on');
  curEl = el;
  el.dataset.sig = sig(slides[next]);
  if (old) { old.classList.remove('on'); setTimeout(() => { old.querySelectorAll('video').forEach(detach); old.remove(); }, 700); }
  stage.querySelector('.empty')?.remove();
  idx = next;
}

function advance() {
  clearTimeout(timer);
  slides = build();
  show((idx + 1) % slides.length);
  const cur = slides[idx];
  timer = setTimeout(advance, cur.secs ? cur.secs * 1000 : (S.screens?.seconds || 12) * 1000 * (cur.k === 'p3' ? 1.5 : 1));
}

// keep the slide on screen up to date without moving to the next one (scores change all the time)
function refresh() {
  slides = build();
  if (idx >= slides.length) idx = -1;
  const cur = curEl;
  if (!cur || idx < 0) return advance();
  if (slides[idx].k === 'cam' && cur.dataset.sig === sig(slides[idx])) return; // the camera keeps playing
  if (slides[idx].k === 'p3' && cur.dataset.sig === sig(slides[idx])) { // keep the video playing: redraw only the side panel
    const tmp = document.createElement('div'); tmp.innerHTML = draw(slides[idx]);
    const side = cur.querySelector('.p3info'), fresh = tmp.querySelector('.p3info');
    if (side && fresh) side.replaceWith(fresh);
    return;
  }
  cur.innerHTML = draw(slides[idx]);
  cur.dataset.sig = sig(slides[idx]);
  startVideo(cur);
}

  const tick = [...recent, s.screens?.ticker].filter(Boolean).join('   ·   ');
  $('ticker').textContent = tick || `${s.name}${s.club ? ` · ${s.club}` : ''}`;
  $('tickTag').textContent = recent.length ? 'JUST IN' : 'UPDATE';
  // hole in one: take over every screen for 25 seconds (only aces that happen while the page is open)
  const aces = s.aces || [];
  if (seenAces === null) seenAces = new Set(aces.map((a) => a.at));
  for (const a of aces) if (!seenAces.has(a.at)) { seenAces.add(a.at);
    if (!lockHole || lockHole === a.hole) takeover(`<div><div class="k">HOLE ${a.hole}</div><h2>Hole in one!</h2><p>${esc(a.name)}</p><small>${esc(a.team)}</small></div>`, '', 25000); }
  if (seenFlash === null) seenFlash = s.flash?.at || 0;
  if (s.flash && s.flash.at > seenFlash) { seenFlash = s.flash.at; takeover(`<div><div class="k">ANNOUNCEMENT</div><h2>${esc(s.flash.text)}</h2></div>`, 'msg', 20000); }
  // a take-over sent from the Golf pro app or the Manager
  const tk = s.live?.take;
  if (seenTake === null) seenTake = tk?.at || 0;
  if (tk && tk.at > seenTake) { seenTake = tk.at; showTake(tk); }
  if (!tk && !$('take').hidden && $('take').dataset.from === 'live') endTake();
  // title sponsor in the header
  const ts = spot('title')[0], tspEl = $('tsp');
  tspEl.hidden = !ts; tspEl.innerHTML = ts ? `PRESENTED BY ${spName(ts)}` : '';
  if (ts) seen(ts.id);
  const wasForced = forced;
  if (first) advance(); else { slides = build(); if (forced !== wasForced) { idx = -1; advance(); } else refresh(); }
}

function showTake(tk) {
  const sp = (S.sponsors || []).find((x) => x.id === tk.sponsor);
  const spHtml = (x, label) => x ? `<div class="tsponsor">${label}${spName(x)}</div>` : '';
  let html = '';
  if (tk.kind === 'replay') {
    const r = (S.replays || []).find((x) => x.id === tk.replay); if (!r || (lockHole && lockHole !== r.hole)) return;
    const cs = spot('cam', r.hole)[0];
    takeover(`<video muted playsinline autoplay></video><div class="rtag">REPLAY · ${r.hole ? `HOLE ${r.hole}` : 'CLUBHOUSE'}</div>${r.label ? `<div class="rlabel">${esc(r.label)}</div>` : ''}${cs ? `<span class="bug">CAM BY ${cs.logo ? `<img src="${esc(cs.logo)}" alt="${esc(cs.name)}">` : esc(cs.name).toUpperCase()}</span>` : ''}`, 'replay', (tk.secs || 30) * 1000);
    $('take').dataset.from = 'live';
    if (cs) seen(cs.id);
    playReplay($('take').querySelector('video'), r, S.cams[r.hole], endTake).then((res) => { if (!res.ok) endTake(); });
    return;
  }
  if (tk.kind === 'ace') {
    const a = (S.aces || []).slice(-1)[0], aceSp = sp || spot('ace', a?.hole)[0] || spot('ace')[0];
    html = `<div>${a ? `<div class="k">HOLE ${a.hole}</div>` : ''}<h2>Hole in one!</h2>${a ? `<p>${esc(a.name)}</p><small>${esc(a.team)}</small>` : (tk.text ? `<p>${esc(tk.text)}</p>` : '')}${spHtml(aceSp, 'Ace presented by')}</div>`;
    if (aceSp) seen(aceSp.id);
  } else if (tk.kind === 'sponsor' && sp) {
    html = `<div><div class="k">OUR SPONSOR</div>${sp.logo ? `<div class="tsponsor" style="margin-top:0">${spName(sp)}</div>` : `<h2>${esc(sp.name)}</h2>`}${sp.line ? `<p>${esc(sp.line)}</p>` : ''}${tk.text ? `<small>${esc(tk.text)}</small>` : ''}</div>`;
    seen(sp.id);
  } else html = `<div><div class="k">ANNOUNCEMENT</div><h2>${esc(tk.text || '')}</h2>${spHtml(sp, 'Brought to you by')}</div>`;
  takeover(html, tk.kind === 'ace' ? '' : 'msg', (tk.secs || 25) * 1000);
  $('take').dataset.from = 'live';
}

// sponsor screen time: count seconds each sponsor is on this screen, send once a minute
const spSecs = {}, spViews = new Set();
function seen(id) { if (id) spViews.add(id); }
setInterval(() => {
  if (!S || document.hidden) return;
  const ids = new Set(spViews);
  const cur = slides[idx];
  if (cur) {
    if (cur.k === 'sponsor' && cur.sp) ids.add(cur.sp.id);
    if (cur.k === 'sponsors') (S.sponsors || []).forEach((x) => ids.add(x.id));
    if (cur.k === 'lb' || cur.k === 'matches') spot('leaderboard').forEach((x) => ids.add(x.id));
    if (cur.k === 'p3') { spot('hole', cur.h.n).forEach((x) => ids.add(x.id)); spot('cam', cur.h.n).forEach((x) => ids.add(x.id)); }
  }
  spot('title').forEach((x) => ids.add(x.id));
  if (!$('take').hidden) { const tk = S.live?.take; if (tk?.sponsor) ids.add(tk.sponsor); }
  for (const id of ids) spSecs[id] = (spSecs[id] || 0) + 5;
  spViews.clear();
}, 5000);
setInterval(() => {
  const list = Object.entries(spSecs).filter(([, n]) => n > 0).map(([s, n]) => ({ s, k: 'secs', n }));
  if (!list.length) return;
  for (const k of Object.keys(spSecs)) delete spSecs[k];
  post('hit', { list }).catch(() => {});
}, 60000);

live(onState, (on) => { const p = $('livepill'); p.textContent = on ? 'LIVE' : 'RECONNECTING'; p.className = `pill ${on ? 'live pulse' : 'off'}`; }, { screen: screenId });
</script>
</body>
</html>
