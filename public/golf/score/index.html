<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123628">
<title>Scorecard · Flagcast</title>
<link rel="icon" href="/golf/brand/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/golf/brand/app-icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/golf/golf.css">
<style>
body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom, 0px); }
.top-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.top-row h1 { font-size: 1.15rem; letter-spacing: .03em; flex: 1; min-width: 0; }
.scorelogo { height: 30px; width: auto; max-width: 110px; object-fit: contain; flex: none; }
.has-club .topbar { border-bottom: 3px solid var(--club, transparent); }
#sync { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
#sync.wait { color: var(--flag); }
.teamtabs { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
.teamtabs button { border: 1px solid var(--on-green-muted); background: transparent; color: var(--on-green); border-radius: 999px; padding: 4px 12px; font-size: .85rem; white-space: nowrap; }
.teamtabs button[aria-pressed="true"] { background: var(--flag); color: var(--on-flag); border-color: var(--flag); }
.strip { display: flex; gap: 6px; overflow-x: auto; padding: 12px 16px; background: var(--green-2); scroll-snap-type: x proximity; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip button { flex: 0 0 auto; width: 42px; height: 46px; border-radius: 8px; border: 1px solid rgba(238,243,236,.25); background: transparent; color: var(--on-green);
  font-family: var(--f-display); font-size: 1.25rem; font-weight: 700; display: grid; place-items: center; line-height: 1; position: relative; scroll-snap-align: center; }
.strip button small { font-family: var(--f-mono); font-size: .55rem; font-weight: 500; color: var(--on-green-muted); }
.strip button.done { background: rgba(238,243,236,.12); }
.strip button.done::after { content: ""; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--flag); }
.strip button.p3 small { color: var(--flag); }
.strip button[aria-current="true"] { background: var(--flag); color: var(--on-flag); border-color: var(--flag); }
.strip button[aria-current="true"] small { color: var(--on-flag); }
main { padding: 18px max(16px, env(safe-area-inset-left, 0px)) 120px; max-width: 560px; margin: 0 auto; }
.holehead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.holehead h2 { font-size: 3rem; font-weight: 800; }
.holehead .facts { text-align: right; font-family: var(--f-mono); font-size: .8rem; color: var(--muted); line-height: 1.5; }
.holehead .facts b { color: var(--ink); font-size: 1rem; }
.sponsor { margin-top: 8px; font-size: .85rem; color: var(--muted); }
/* photos the club added: the cover (before the first score), the hole's photo, a sponsor's banner */
.cover { position: relative; margin: 0 0 16px; border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 9; background: var(--green) center / cover no-repeat; display: flex; align-items: flex-end; }
.cover div { width: 100%; padding: 28px 14px 12px; color: #fff; background: linear-gradient(transparent, rgba(0, 0, 0, .7)); }
.cover small { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.cover b { display: block; font-family: var(--f-display); font-size: 1.6rem; line-height: 1.1; }
.holephoto { margin-top: 12px; width: 100%; aspect-ratio: 16 / 9; max-height: 220px; object-fit: cover; border-radius: 12px; display: block; background: var(--paper-2); }
.spbanner { display: block; width: 100%; max-height: 110px; object-fit: cover; border-radius: 10px; margin-bottom: 6px; }
.note { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--paper-2); font-size: .9rem; }
.note b { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .04em; }
.players { display: grid; gap: 10px; margin-top: 16px; }
.pl { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
.pl .who { min-width: 0; }
.pl .who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .who span { font-size: .78rem; color: var(--muted); }
.dots { color: var(--red); letter-spacing: .1em; }
.step { display: flex; align-items: center; gap: 6px; }
.step button.pm { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--paper); font-size: 1.5rem; line-height: 1; display: grid; place-items: center; }
.step .val { width: 54px; height: 54px; border-radius: 10px; border: 1.5px dashed var(--line); background: transparent; font-family: var(--f-mono); font-size: 1.6rem; font-weight: 600; display: grid; place-items: center; color: var(--muted); }
.step .val.set { border-style: solid; color: var(--ink); }
.step .val.set.birdie, .step .val.set.eagle { border-color: var(--red); color: var(--red); border-radius: 50%; }
.step .val.set.bogey, .step .val.set.double { border-color: var(--ink); }
.aa { border: 1px solid rgba(255,255,255,.35); background: none; color: inherit; border-radius: 8px; min-width: 44px; min-height: 36px; font-weight: 700; flex: none; }
.offline { background: #fff3cd; color: #5c4400; padding: 10px 16px; font-size: .9rem; line-height: 1.35; }
.offline button { border: 1px solid #c9a227; background: #fff; color: #5c4400; border-radius: 8px; padding: 6px 12px; min-height: 36px; margin-left: 6px; font-weight: 600; }
.pu { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); }
.pu button { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 12px 6px; margin: -12px -6px; min-height: 44px; font-size: .78rem; } /* a 44 pt target for a finger in a moving cart */
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 10px; }
.bar .btn { flex: 1; padding: 14px; font-size: 1.05rem; }
.card { margin-top: 26px; overflow-x: auto; }
.card table { border-collapse: collapse; font-family: var(--f-mono); font-size: .78rem; font-variant-numeric: tabular-nums; min-width: 100%; }
.card th, .card td { padding: 5px 4px; text-align: center; border-bottom: 1px solid var(--line); }
.card th:first-child, .card td:first-child { text-align: left; padding-right: 10px; white-space: nowrap; font-family: var(--f-body); font-weight: 600; }
.card thead th { color: var(--muted); font-weight: 500; }
.card .sc { min-width: 1.7em; height: 1.7em; }
.summary { display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; gap: 12px; }
.summary .big { font-family: var(--f-display); font-size: 2rem; font-weight: 800; }
.cam { margin-top: 12px; display: block; text-align: center; }
.center { text-align: center; padding: 48px 20px; max-width: 420px; margin: 0 auto; }
.center h2 { font-size: 2rem; margin-bottom: 10px; }
.center p { color: var(--muted); }
.locked { background: var(--red); color: #fff; text-align: center; padding: 8px; font-weight: 600; font-size: .9rem; }
.spoffer { display: inline-block; margin-top: 4px; font-weight: 600; color: var(--green-2); }
@media (prefers-color-scheme: dark) { .spoffer { color: var(--flag); } }
.nudge { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 60; padding: 20px; }
.nudge > div { background: var(--card); border-radius: 16px; padding: 22px; max-width: 360px; width: 100%; text-align: center; }
.nudge h2 { font-size: 1.8rem; margin-top: 6px; }
.nudge p { font-size: 1.1rem; }
.nudge .btn { width: 100%; padding: 14px; }
.sg h2 { font-size: 2rem; }
.sg .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 14px; }
.sg .box h3 { font-size: 1.25rem; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sg .sw { display: flex; align-items: center; gap: 8px; font: 500 .9rem var(--f-body); text-transform: none; letter-spacing: 0; }
.sg .sw input { width: 22px; height: 22px; accent-color: #2f8a57; }
.sg .opts { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 10px; font-size: .88rem; color: var(--muted); align-items: center; }
.sg .opts label { display: flex; align-items: center; gap: 6px; }
.sg .opts input[type=number] { width: 76px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); font: 600 1rem var(--f-mono); }
.sg select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); font: inherit; }
.sg table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: .88rem; font-variant-numeric: tabular-nums; }
.sg td, .sg th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.sg th { font-weight: 500; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
.sg td.r, .sg th.r { text-align: right; }
.sg .holes { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.sg .holes span { font-family: var(--f-mono); font-size: .72rem; padding: 4px 6px; border-radius: 6px; background: var(--paper-2); color: var(--muted); min-width: 2.4em; text-align: center; }
.sg .holes span.won { background: #2f8a57; color: var(--on-green); }
.sg .box > .help { margin-top: 6px; font-size: .85rem; color: var(--muted); }
.sg .picks { display: grid; gap: 6px; margin-top: 10px; }
.sg .picks div { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .9rem; }
.sg .picks small { display: block; font-size: .75rem; color: var(--muted); }
.sg td.up { color: var(--ok); } .sg td.down { color: var(--red); }
.sg .holes span.tie { color: var(--ink); }
.sg .sides { display: grid; gap: 6px; margin-top: 10px; }
.sg .sides div { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .9rem; }
.sg .seg { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
.sg .owe { font-size: 1.05rem; padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; }
.sg .owe b { font-family: var(--f-mono); }
.sg .fine { font-size: .8rem; color: var(--muted); margin-top: 12px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="top-row"><img data-brand="club" class="scorelogo" hidden alt=""><h1 id="evname">Scorecard</h1><button id="textsize" class="aa" aria-label="Text size">Aa</button><span id="sync">Connecting…</span></div>
  <div class="teamtabs" id="tabs" hidden></div>
</header>
<div class="offline" id="offline" role="status" hidden><b>No signal.</b> <span id="offmsg">Your scores are saved on this phone and send by themselves when you’re back in range.</span> <button id="trynow">Try now</button></div>
<div class="locked" id="locked" hidden>Scoring is closed. The results are final.</div>
<nav class="strip" id="strip" aria-label="Holes"></nav>
<main id="main"><div class="center"><h2>Loading</h2><p>Getting your scorecard.</p></div></main>
<div class="bar" id="bar" hidden>
  <button class="btn" id="prev">Back</button>
  <button class="btn primary" id="next">Next hole</button>
</div>
<div class="toast" id="toast" hidden></div>
<div class="nudge" id="nudge" role="alertdialog" aria-labelledby="nudgeH" hidden><div><span class="label">From the pro shop</span><h2 id="nudgeH">A note for your cart</h2><p id="nudgeText"></p><button class="btn primary" onclick="this.closest('.nudge').hidden=true">OK</button></div></div>
<script type="module">
import { phoneBanner } from '/golf/phonecast.js';
import { applyBrand } from '/golf/brandmark.js';
import { gpsCard } from '/golf/gpscard.js';
import { groupsMap, hidden as groupHidden } from '/golf/groupsmap.js';
import { onGps, yds, trackingOn, mapped } from '/golf/gps.js';
import { leaderboard, playHoles, teamCard, strokesOn, playing, fmtPar, mark, contestLeader, fmtDist, sideGames } from '/golf/core.js';
import { eventId, post, live, esc } from '/golf/client.js';
import { appBar, remember } from '/golf/appbar.js';
appBar('score');

const code = (location.pathname.match(/\/s\/([A-Z0-9]{6})/) || [])[1] || '';
const KEY = `golf:${eventId()}:${code}`;
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(`${KEY}:${k}`)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(`${KEY}:${k}`, JSON.stringify(v)); } catch {} } };
let S = null, teams = store.get('teams', []), teamId = store.get('team', null), hole = store.get('hole', null);
let pending = store.get('pending', []); // [{ team, p, h, v, at }] not yet saved on the server
let online = false, sending = false, view = 'card', offSince = Date.now();
// side games: this cart's own settings, kept on this phone
const SIDE_DEFAULTS = { skins: { on: false, amt: 5, net: true, carry: true }, nassau: { on: false, amt: 10, net: true, sides: {} }, birdies: { on: false, amt: 2, net: false },
  stableford: { on: false, net: true }, vegas: { on: false, amt: 1, net: true, sides: {} }, wolf: { on: false, amt: 1, net: true, picks: {} },
  closest: { on: false, amt: 2, picks: {} }, longDrive: { on: false, amt: 2, picks: {} } };
let side = store.get('side', {});
for (const [g, d] of Object.entries(SIDE_DEFAULTS)) side[g] = { ...d, ...(side[g] || {}) }; // older saved settings gain the newer games, turned off
const sideOn = () => Object.keys(SIDE_DEFAULTS).some((g) => side[g].on);
const $ = (id) => document.getElementById(id);

function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 3200); }

// scores as this phone knows them: the server's, with anything still waiting to send on top
function myScores() {
  const sc = JSON.parse(JSON.stringify(S.scores || {}));
  for (const e of pending) { ((sc[e.team] ||= {})[e.p] ||= Array(18).fill(null))[e.h - 1] = e.v; }
  return sc;
}
const team = () => S && S.teams.find((t) => t.id === teamId);
const who = (t) => (S.format.type === 'scramble' ? [{ id: 'T', name: t.name || 'Team', hcp: t.hcp }] : t.players);
// the holes this cart plays, in order from its starting hole (only the front or back 9 on a 9-hole round)
const inRound = (h) => playHoles(S).includes(h.n);
const order = (t) => { const ph = playHoles(S), k = Math.max(0, ph.indexOf(t.start || ph[0])); return [...ph.slice(k), ...ph.slice(0, k)]; };

function setScore(p, h, v) {
  pending = pending.filter((e) => !(e.team === teamId && e.p === p && e.h === h));
  pending.push({ team: teamId, p, h, v, at: Date.now() });
  store.set('pending', pending);
  render(); send();
}

async function send() {
  if (sending || !pending.length) return syncLabel();
  sending = true; syncLabel();
  const batch = pending.slice();
  const byTeam = {};
  for (const e of batch) (byTeam[e.team] ||= []).push(e);
  try {
    for (const [t, list] of Object.entries(byTeam)) await post('score', { code, team: t, list });
    const sent = new Set(batch);
    pending = pending.filter((e) => !sent.has(e));
    store.set('pending', pending);
  } catch (e) {
    if (e.status === 423 || e.status === 403) { pending = []; store.set('pending', pending); toast(e.message); }
  }
  sending = false; syncLabel();
  if (pending.length) setTimeout(send, 5000);
}
setInterval(syncLabel, 5000); // the banner appears if scores have waited too long
addEventListener('online', send);

// text size (Aa): standard, large, larger; remembered on this phone
const SIZES = ['100%', '115%', '130%'];
let sizeAt = Math.max(0, SIZES.indexOf(store.get('textSize', '100%')));
const applySize = () => { document.documentElement.style.fontSize = SIZES[sizeAt]; $('textsize').setAttribute('aria-label', `Text size: ${['standard', 'large', 'larger'][sizeAt]}`); };
applySize();
$('textsize').addEventListener('click', () => { sizeAt = (sizeAt + 1) % SIZES.length; store.set('textSize', SIZES[sizeAt]); applySize(); toast(['Standard text', 'Large text', 'Larger text'][sizeAt]); });
$('trynow').addEventListener('click', () => { send(); toast('Trying again…'); });

function syncLabel() {
  // the banner: off the network, or scores still waiting after a while
  const stuck = pending.length && pending[0].at < Date.now() - 15000;
  // (a few seconds' grace: the link takes a moment to open, and a blip isn't worth a banner)
  $('offline').hidden = !((!online && Date.now() - offSince > 4000) || stuck);
  if (!$('offline').hidden) $('offmsg').textContent = pending.length
    ? `${pending.length} score${pending.length === 1 ? '' : 's'} saved on this phone. They send by themselves when you’re back in range.`
    : 'Your scores are saved on this phone and send by themselves when you’re back in range.';
  const el = $('sync');
  if (pending.length) { el.textContent = `${pending.length} waiting to send`; el.className = 'wait'; }
  else if (!online) { el.textContent = 'Offline · scores are kept'; el.className = 'wait'; }
  else { el.textContent = 'All saved'; el.className = ''; }
}

// sponsors: logo, line and offer on the hole; views and taps are counted for the sponsor report
const hitSeen = new Set(); let hitQ = [];
function hit(s, k, once) {
  if (once) { if (hitSeen.has(once)) return; hitSeen.add(once); }
  hitQ.push({ s, k, n: 1 });
  clearTimeout(hit.t); hit.t = setTimeout(() => { const list = hitQ.splice(0, 50); if (list.length) post('hit', { list }).catch(() => {}); }, 4000);
}
function spHtml(x, lead) {
  const ban = S?.photos?.sponsors?.[x.id], banner = ban ? (x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener" data-sp="${esc(x.id)}"><img class="spbanner" src="${esc(ban)}" alt="${esc(x.name)}"></a>` : `<img class="spbanner" src="${esc(ban)}" alt="${esc(x.name)}">`) : '';
  const name = x.logo ? `<img src="${esc(x.logo)}" alt="${esc(x.name)}" style="height:26px;width:auto;max-width:140px;object-fit:contain;vertical-align:middle">` : `<b>${esc(x.name)}</b>`;
  const offer = x.offer ? (x.url ? `<a class="spoffer" href="${esc(x.url)}" target="_blank" rel="noopener" data-sp="${esc(x.id)}">${esc(x.offer)}</a>` : `<span class="spoffer">${esc(x.offer)}</span>`) : (x.url ? `<a class="spoffer" href="${esc(x.url)}" target="_blank" rel="noopener" data-sp="${esc(x.id)}">Visit ${esc(x.name)}</a>` : '');
  return `<div class="sponsor">${banner}${lead ? `${lead} ` : ''}${name}${x.line ? ` · ${esc(x.line)}` : ''}${offer ? `<br>${offer}` : ''}</div>`;
}
document.addEventListener('click', (e) => { const a = e.target.closest('a[data-sp]'); if (a) hit(a.dataset.sp, 'tap'); });

// a message from the pro shop to this cart (for example, keep up the pace of play)
const NKEY = `golf:${eventId()}:nudge`;
function nudges() {
  if (!S || !S.nudges) return;
  const seen = Number(localStorage.getItem(NKEY) || Date.now() - 15 * 60000);
  const mine = S.nudges.filter((n) => teams.includes(n.team) && n.at > seen);
  if (!mine.length) return;
  const n = mine[mine.length - 1];
  try { localStorage.setItem(NKEY, String(n.at)); } catch {}
  $('nudgeText').textContent = n.text; $('nudge').hidden = false;
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

// hole GPS: yardages and the course view, when the course is mapped
const gps = gpsCard({ onHole: (d) => { const t = team(); if (!t) return; const ord = order(t), i = ord.indexOf(hole); hole = ord[Math.max(0, Math.min(ord.length - 1, i + d))]; render(); } });
// with GPS on, the desk and the other groups (unless this group hides) see where this group is (every 30 s, or sooner after a walk)
let sent = null;
onGps((f) => {
  if (!f.at || !teamId || !trackingOn(S)) return; // only while the tournament is on
  if (sent && Date.now() - sent.t < 30000 && yds(sent.at, f.at) < 25) return;
  sent = { t: Date.now(), at: f.at };
  post('where', { code, team: teamId, at: f.at, acc: f.acc, hole, hide: groupHidden(code) }).catch(() => {});
});
const sideOK = () => S && S.sideGames !== false && S.format.type !== 'scramble';
// where everyone is: the other groups on a map (groupsmap.js), on the day of the tournament or when the course is mapped
const whereOK = () => S && (trackingOn(S) || mapped(S));
let gmap = null;
function renderWhere() {
  if (gmap) return gmap.refresh();
  gmap = groupsMap({ state: () => S, code, team: () => teamId, hole: () => hole, onClose: () => { view = 'card'; render(); } });
}
function render() {
  if (!S) return;
  if (view === 'where' && whereOK()) return renderWhere();
  if (gmap) { gmap.destroy(); gmap = null; view = 'card'; }
  if (view === 'side' && sideOK()) return renderSide();
  $('strip').hidden = false;
  $('evname').textContent = S.screens?.title || S.name || 'Scorecard';
  $('locked').hidden = !S.locked;
  const t = team();
  if (!t) { $('main').innerHTML = `<div class="center"><h2>Not found</h2><p>This scorecard isn’t part of the tournament any more. Ask the tournament desk for your cart card.</p></div>`; $('bar').hidden = true; return; }
  const tabs = $('tabs');
  tabs.hidden = teams.length < 2;
  tabs.innerHTML = teams.map((id) => { const x = S.teams.find((y) => y.id === id); return x ? `<button data-team="${id}" aria-pressed="${id === teamId}">${esc(x.name || x.players.map((p) => p.name).join(' / '))}</button>` : ''; }).join('');
  const sc = myScores(), mine = sc[t.id] || {}, holes = S.course.holes, ps = who(t);
  if (hole && !order(t).includes(hole)) hole = 0; // a hole saved from before the round was set to 9 holes
  if (!hole) hole = order(t).find((h) => !ps.every((p) => (mine[p.id] || [])[h - 1] != null)) || order(t)[0];
  const allow = S.format.allowance ?? 100;
  $('strip').innerHTML = order(t).map((h) => {
    const done = ps.every((p) => (mine[p.id] || [])[h - 1] != null);
    const par = holes[h - 1].par;
    return `<button data-hole="${h}" class="${done ? 'done' : ''} ${par === 3 ? 'p3' : ''}" aria-current="${h === hole}">${h}<small>P${par}</small></button>`;
  }).join('');
  const H = holes[hole - 1];
  const sponsor = (S.sponsors || []).find((s) => s.spot === 'hole' && s.holes.includes(hole)) || (S.sponsors || []).find((s) => s.holes.includes(hole));
  const turn = hole === 10 ? (S.sponsors || []).find((s) => s.spot === 'turn') : null;
  if (sponsor) hit(sponsor.id, 'view', `${sponsor.id}:${hole}`); if (turn) hit(turn.id, 'view', `${turn.id}:turn`);
  const contests = (S.contests || []).filter((c) => c.hole === hole);
  const lb = leaderboard(S, sc).find((l) => l.teamId === t.id);
  const cover = S.photos?.cover && !ps.some((p) => (mine[p.id] || []).some((v) => v != null)), hp = S.photos?.holes?.[hole];
  $('main').innerHTML = `
    ${cover ? `<div class="cover" style="background-image:url('${esc(S.photos.cover)}')"><div><small>Welcome to</small><b>${esc(S.screens?.title || S.name)}</b></div></div>` : ''}
    <div class="holehead"><h2>Hole ${hole}</h2><div class="facts"><b>Par ${H.par}</b><br>${H.yds ? `${H.yds} yds · ` : ''}SI ${H.hcp}</div></div>
    ${hp ? `<img class="holephoto" src="${esc(hp)}" alt="Hole ${hole}">` : ''}
    <div id="gpsSlot"></div>
    ${sponsor ? spHtml(sponsor, 'Presented by') : ''}
    ${turn ? `<div class="note"><b>At the turn</b><br>${spHtml(turn, '')}</div>` : ''}
    ${contests.map((c) => { const top = contestLeader(c)[0]; return `<div class="note"><b>${c.kind === 'ld' ? 'Long drive' : 'Closest to the pin'}</b>${c.sponsor ? ` · ${esc(c.sponsor)}` : ''}<br>${top ? `Leader: ${esc(top.name)}, ${fmtDist(c, top.dist)}.` : 'No one on the board yet.'} A marshal measures at the green.</div>`; }).join('')}
    ${S.cams && S.cams[hole] ? `<a class="btn cam" href="/g/${eventId()}#hole-${hole}">Watch the hole ${hole} camera</a>` : ''}
    <div class="players">${ps.map((p) => {
      const v = (mine[p.id] || [])[hole - 1];
      const st = strokesOn(playing(p.hcp, allow), H.hcp);
      const set = v != null;
      const shown = !set ? H.par : v === 0 ? 'PU' : v;
      return `<div class="pl"><div class="who"><b>${esc(p.name)}</b><span>${st > 0 ? `<span class="dots" title="Strokes on this hole">${'●'.repeat(st)}</span> gets ${st} stroke${st > 1 ? 's' : ''}` : st < 0 ? 'gives a stroke back' : 'no strokes here'}</span></div>
        <div class="step"><button class="pm" data-p="${p.id}" data-d="-1" aria-label="One fewer for ${esc(p.name)}">−</button>
        <button class="val ${set ? 'set' : ''} ${set ? mark(v, H.par) : ''}" data-p="${p.id}" data-d="0" aria-label="${set ? `Score ${shown}` : `Tap to enter par for ${esc(p.name)}`}">${shown}</button>
        <button class="pm" data-p="${p.id}" data-d="1" aria-label="One more for ${esc(p.name)}">+</button></div>
        <div class="pu"><span>${set ? '' : 'Tap the number for par'}</span><span>${set ? `<button data-clear="${p.id}">Clear</button> · ` : ''}<button data-pu="${p.id}">Picked up</button></span></div></div>`;
    }).join('')}</div>
    <div class="summary"><div><div class="label">${S.format.show === 'gross' ? 'Gross' : 'Net'} to par</div><div class="big ${lb && lb.score < 0 && S.format.type !== 'stableford' ? 'under' : ''}">${lb && lb.played ? fmtPar(lb.score, S.format.type === 'stableford') : '—'}</div></div>
      <div style="text-align:right"><div class="label">Position</div><div class="big">${lb && lb.pos ? lb.pos : '—'}</div></div></div>
    <a class="btn" style="width:100%;margin-top:10px" href="/g/${eventId()}">Full leaderboard</a>
    ${sideOK() ? `<button class="btn" style="width:100%;margin-top:10px" data-view="side">Side games${sideOn() ? ' · playing' : ''}</button>` : ''}
    ${whereOK() ? `<button class="btn" style="width:100%;margin-top:10px" data-view="where">See everyone on the course</button>` : ''}
    <div class="card"><table><thead><tr><th>Hole</th>${holes.filter(inRound).map((h) => `<th>${h.n}</th>`).join('')}<th>Tot</th></tr>
      <tr><th>Par</th>${holes.filter(inRound).map((h) => `<th>${h.par}</th>`).join('')}<th>${holes.filter(inRound).reduce((a, h) => a + h.par, 0)}</th></tr></thead>
      <tbody>${ps.map((p) => { const arr = mine[p.id] || []; const tot = arr.reduce((a, v) => a + (v > 0 ? v : 0), 0);
        return `<tr><td>${esc(p.name.split(' ')[0] || p.name)}</td>${holes.filter(inRound).map((h) => { const v = arr[h.n - 1]; return `<td>${v == null ? '' : v === 0 ? 'PU' : `<span class="sc ${mark(v, h.par)}">${v}</span>`}</td>`; }).join('')}<td>${tot || ''}</td></tr>`; }).join('')}</tbody></table></div>`;
  gps.update(S, hole); gps.mount($('gpsSlot'));
  $('bar').hidden = false;
  const ord = order(t), i = ord.indexOf(hole);
  $('prev').disabled = i === 0;
  $('next').textContent = i === ord.length - 1 ? 'Done' : `Hole ${ord[i + 1]}`;
  store.set('hole', hole);
  document.querySelector('.strip [aria-current="true"]')?.scrollIntoView({ inline: 'center', block: 'nearest' });
}

const pts = (v) => { const a = Math.round(Math.abs(v) * 10) / 10; return `${a} pts`; };
function renderSide() {
  $('strip').hidden = true; $('bar').hidden = true;
  const sc = myScores(), r = sideGames(S, sc, teams, side), P = Object.fromEntries(r.players.map((p) => [p.key, p]));
  const nm = (k) => esc(P[k]?.short || '');
  const n = r.players.length;
  const sw = (g, label) => `<label class="sw"><input type="checkbox" data-sg="${g}.on" ${side[g].on ? 'checked' : ''}> ${label || 'Play'}</label>`;
  const amt = (g, label) => `<label><input type="number" min="0" step="1" inputmode="decimal" data-sg="${g}.amt" value="${side[g].amt}"> pts ${label}</label>`;
  const netSel = (g) => `<select data-sg="${g}.net" aria-label="Net or gross"><option value="1" ${side[g].net ? 'selected' : ''}>Net (with strokes)</option><option value="" ${side[g].net ? '' : 'selected'}>Gross</option></select>`;
  const sidesFor = (g, sides) => { const inA = new Set(sides.A); return `<div class="sides">${r.players.map((p) => `<div><span>${esc(p.short)}</span><select data-side="${g}:${p.key}" aria-label="Side for ${esc(p.short)}"><option value="A" ${inA.has(p.key) ? 'selected' : ''}>Side A</option><option value="B" ${inA.has(p.key) ? '' : 'selected'}>Side B</option></select></div>`).join('')}</div>`; };
  const pickSel = (g, hole, cur, opts) => `<select data-pick="${g}:${hole}" aria-label="Hole ${hole}"><option value="">Not yet</option>${opts.map(([v, t]) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  const box = (g, title, about, body) => `<div class="box"><h3>${title} ${sw(g)}</h3>${side[g].on ? body : `<p class="help">${about}</p>`}</div>`;
  let html = `<div class="sg"><h2>Side games</h2>`;
  if (n < 2) {
    html += `<div class="note"><b>${n === 1 ? 'You’re the only player in your cart.' : 'Nobody is in your cart yet.'}</b><br>Side games need at least two players. They open up here once your cart has two or more.</div>`;
    html += `<button class="btn primary" style="width:100%;margin-top:16px;padding:14px" data-view="card">Back to the scorecard</button></div>`;
    $('main').innerHTML = html; return;
  }
  html += `<p class="help" style="color:var(--muted)">Games among the ${n} players in your cart. The scores you enter play every game, and the points add up at the bottom.</p>`;

  // skins
  let b = `<div class="opts">${amt('skins', 'a skin, from each player')}${netSel('skins')}<label class="sw"><input type="checkbox" data-sg="skins.carry" ${side.skins.carry !== false ? 'checked' : ''}> Ties carry over</label></div>`;
  if (r.skins) {
    b += `<div class="holes">${r.skins.rows.map((x) => x.open ? `<span title="Not played yet">${x.hole}</span>` : x.winner ? `<span class="won">${x.hole} ${nm(x.winner)}${x.worth > 1 ? ` ×${x.worth}` : ''}</span>` : `<span class="tie">${x.hole} tie</span>`).join('')}</div>`;
    b += `<table><tr><th>Player</th><th class="r">Skins</th></tr>${r.players.map((p) => `<tr><td>${esc(p.short)}</td><td class="r">${r.skins.won[p.key] || 0}</td></tr>`).join('')}</table>`;
    if (r.skins.carrying) b += `<p class="help" style="margin-top:6px">${r.skins.carrying} skin${r.skins.carrying > 1 ? 's' : ''} carrying to the next hole.</p>`;
  }
  html += box('skins', 'Skins', 'Lowest score alone wins the hole.', b);

  // Nassau
  b = `<div class="opts">${amt('nassau', 'each on the front 9, back 9 and overall')}${netSel('nassau')}</div>`;
  if (r.nassau) {
    b += sidesFor('nassau', r.nassau.sides);
    const sideName = (x) => r.nassau.sides[x].map(nm).join(' &amp; ');
    b += r.nassau.segs.map((g) => {
      const st = !g.played ? 'Not started' : g.done ? (g.winner ? `${sideName(g.winner)} win, ${Math.abs(g.diff)} up` : 'Tied, no points') : g.diff ? `${sideName(g.diff > 0 ? 'A' : 'B')} ${Math.abs(g.diff)} up thru ${g.played}` : `All square thru ${g.played}`;
      return `<div class="seg"><span>${g.label}</span><b>${st}</b></div>`;
    }).join('');
  } else b += `<p class="help" style="margin-top:8px">Put at least one player on each side.</p>`;
  html += box('nassau', 'Nassau', 'Two sides, three matches: the front 9, the back 9 and the whole round.', b);

  // birdies
  b = `<div class="opts">${amt('birdies', 'a birdie, from each player (an eagle counts twice)')}${netSel('birdies')}</div>`;
  if (r.birdies) b += r.birdies.list.length ? `<div class="holes">${r.birdies.list.map((x) => `<span class="won">${x.hole} ${nm(x.key)}${x.eagle ? ' eagle' : ''}</span>`).join('')}</div>` : `<p class="help" style="margin-top:8px">No birdies yet.</p>`;
  html += box('birdies', 'Birdies', 'Every birdie collects from each other player. An eagle counts twice.', b);

  // Stableford
  const sfAbout = 'Points against par on every hole: double bogey or worse 0, bogey 1, par 2, birdie 3, eagle 4. Most points wins.';
  b = `<div class="opts">${netSel('stableford')}</div><p class="help">${sfAbout} Its points stay in this table.</p>`;
  if (r.stableford) b += `<table><tr><th>Player</th><th class="r">Points</th></tr>${[...r.stableford].sort((x, y) => y.points - x.points).map((x) => `<tr><td>${nm(x.key)}</td><td class="r">${x.thru ? `${x.points} thru ${x.thru}` : '–'}</td></tr>`).join('')}</table>`;
  html += box('stableford', 'Stableford', sfAbout, b);

  // Vegas
  b = `<div class="opts">${amt('vegas', 'each point of difference')}${netSel('vegas')}</div>`;
  if (r.vegas && n === 4) b += sidesFor('vegas', r.vegas.sides);
  if (r.vegas && !r.vegasNeedsFour) {
    const sideName = (x) => r.vegas.sides[x].map(nm).join(' &amp; ');
    b += r.vegas.holes.length ? `<div class="holes">${r.vegas.holes.map((h) => `<span class="${h.a !== h.b ? 'won' : 'tie'}">${h.hole} ${h.a}–${h.b}</span>`).join('')}</div>
      <div class="seg"><span>Running</span><b>${r.vegas.total ? `${sideName(r.vegas.total > 0 ? 'A' : 'B')} +${Math.abs(r.vegas.total)}` : 'All square'}</b></div>` : `<p class="help" style="margin-top:8px">No holes finished yet.</p>`;
  } else b += `<p class="help" style="margin-top:8px">${n === 4 ? 'Put two players on each side.' : 'Vegas needs exactly four players, two on each side.'}</p>`;
  html += box('vegas', 'Vegas', 'Two against two. Each side’s scores make a number, low score first (a 4 and a 5 make 45). The lower number wins the difference.', b);

  // Wolf
  b = `<div class="opts">${amt('wolf', 'each hole (a lone wolf plays for double)')}${netSel('wolf')}</div>`;
  if (r.wolf) {
    b += `<p class="help">The wolf goes in cart order. Pick the wolf’s call after the tee shots. The hole scores once everyone’s score is in.</p><div class="picks">${r.wolf.holes.map((h) => {
      const res = h.result === 'wolf' ? 'Wolf won' : h.result === 'others' ? 'Wolf lost' : h.result === 'tie' ? 'Halved' : '';
      const opts = [...r.players.filter((p) => p.key !== h.wolf).map((p) => [p.key, `With ${esc(p.short)}`]), ['lone', 'Lone wolf']];
      return `<div><span>Hole ${h.hole}: ${nm(h.wolf)}${res ? `<small>${res}</small>` : ''}</span>${pickSel('wolf', h.hole, h.partner || '', opts)}</div>`;
    }).join('')}</div>`;
  } else b += `<p class="help" style="margin-top:8px">Wolf needs three or four players.</p>`;
  html += box('wolf', 'Wolf', 'The wolf rotates each hole. After the tee shots the wolf takes a partner or goes it alone, then the best ball on each side wins the hole.', b);

  // closest to the pin, long drive
  const pickBox = (g, title, rows, empty, about) => {
    let x = `<div class="opts">${amt(g, 'each hole, from each player')}</div>`;
    if (rows) x += rows.length ? `<div class="picks">${rows.map((h) => `<div><span>Hole ${h.hole}</span>${pickSel(g, h.hole, h.winner || '', r.players.map((p) => [p.key, esc(p.short)]))}</div>`).join('')}</div>` : `<p class="help" style="margin-top:8px">${empty}</p>`;
    return box(g, title, about, x);
  };
  html += pickBox('closest', 'Closest to the pin', r.closest, 'This course has no par 3s.', 'On each par 3, pick who’s closest. Everyone else gives them the points.');
  html += pickBox('longDrive', 'Long drive', r.longDrive, 'This course has no par 5s.', 'On each par 5, pick who hit the longest drive in the fairway.');

  if (r.skins || r.nassau || r.birdies || r.vegas || r.wolf || r.closest || r.longDrive) {
    html += `<div class="box"><h3>Points</h3>
      <table><tr><th>Player</th><th class="r">Up or down</th></tr>${[...r.players].sort((x, y) => r.ledger[y.key] - r.ledger[x.key]).map((p) => { const v = Math.round(r.ledger[p.key] * 100) / 100; return `<tr><td>${esc(p.short)}</td><td class="r ${v > 0 ? 'up' : v < 0 ? 'down' : ''}">${v ? `${v > 0 ? '+' : '−'}${pts(v)}` : 'Even'}</td></tr>`; }).join('')}</table>
      <p class="fine">Running totals from every game you’re playing (Stableford has its own table). For points and bragging rights only: Flagcast has no money in it. These game settings are kept on this phone.</p></div>`;
  }
  html += `<button class="btn primary" style="width:100%;margin-top:16px;padding:14px" data-view="card">Back to the scorecard</button></div>`;
  $('main').innerHTML = html;
}
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.sg) {
    const [g, k] = el.dataset.sg.split('.');
    side[g][k] = el.type === 'checkbox' ? el.checked : k === 'amt' ? Math.max(0, Math.min(1000, Number(el.value) || 0)) : !!el.value;
  } else if (el.dataset.side) {
    const at = el.dataset.side.indexOf(':'), g = el.dataset.side.slice(0, at), key = el.dataset.side.slice(at + 1);
    side[g].sides = { ...side[g].sides, [key]: el.value };
  } else if (el.dataset.pick) {
    const [g, hole] = el.dataset.pick.split(':'), picks = { ...side[g].picks };
    if (el.value) picks[hole] = el.value; else delete picks[hole];
    side[g].picks = picks;
  } else return;
  store.set('side', side); render();
});

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || !S) return;
  if (b.dataset.view) { view = b.dataset.view; render(); scrollTo(0, 0); return; }
  const t = team(); if (!t && !b.dataset.team) return;
  if (S.locked && (b.dataset.p || b.dataset.pu || b.dataset.clear)) return toast('Scoring is closed. The results are final.');
  if (b.dataset.team) { teamId = b.dataset.team; store.set('team', teamId); hole = null; render(); return; }
  if (b.dataset.hole) { hole = Number(b.dataset.hole); render(); return; }
  const H = S.course.holes[hole - 1];
  if (b.dataset.p) {
    const p = b.dataset.p, cur = ((myScores()[t.id] || {})[p] || [])[hole - 1];
    const base = cur == null || cur === 0 ? H.par : cur;
    const d = Number(b.dataset.d);
    const v = d === 0 ? base : cur == null ? H.par + d : base + d;
    setScore(p, hole, Math.max(1, Math.min(15, v)));
    if (v === 1) toast('Hole in one! It’s on the big screens now.');
    return;
  }
  if (b.dataset.pu) return setScore(b.dataset.pu, hole, 0);
  if (b.dataset.clear) return setScore(b.dataset.clear, hole, null);
  if (b.id === 'next' || b.id === 'prev') {
    const ord = order(t), i = ord.indexOf(hole);
    if (b.id === 'next' && i === ord.length - 1) { location.href = `/g/${eventId()}`; return; }
    if (b.id === 'next') {
      const mine = myScores()[t.id] || {};
      const missing = who(t).filter((p) => (mine[p.id] || [])[hole - 1] == null);
      if (missing.length) toast(`No score yet for ${missing.map((p) => p.name.split(' ')[0]).join(' and ')} on hole ${hole}.`);
    }
    hole = ord[Math.max(0, Math.min(17, i + (b.id === 'next' ? 1 : -1)))];
    render(); scrollTo(0, 0);
  }
});

async function start() {
  if (!code) { $('main').innerHTML = `<div class="center"><h2>No code</h2><p>Scan the QR code on your cart card to open your scorecard.</p></div>`; return; }
  try {
    const r = await post('cart', { code });
    teams = r.teams; store.set('teams', teams);
    if (!teams.includes(teamId)) { teamId = teams[0]; store.set('team', teamId); }
  } catch (e) {
    if (e.status === 404) { $('main').innerHTML = `<div class="center"><h2>Code not found</h2><p>${esc(e.message)}</p></div>`; return; }
    // no signal: carry on with what this phone already knows
  }
  live((s) => { S = s; applyBrand(s); store.set('state', s); remember(s.name, code); render(); nudges(); phoneBanner(S, (r) => { location.href = `/g/${eventId()}${r.k === 'cam' || r.k === 'p3' ? `#hole-${r.hole}` : `#v=${r.k === 'contests' ? 'ct' : r.k === 'skins' ? 'sk' : 'lb'}`}`; }); }, (on) => { if (!on && online) offSince = Date.now(); online = on; syncLabel(); if (on) send(); });
  if (!S) { const saved = store.get('state', null); if (saved && teams.length) { S = saved; render(); } }
  send();
}
start();
</script>
</body>
</html>
